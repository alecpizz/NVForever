# [design, #2014, #2317, #2662, #2688, #2149, #2169, #2403] Rows main registers without a Russian line.
"On: when choices appear the view returns to the speaker (with the close-up off). Needs \"Turn to Each Other\"." = "Вкл.: когда появляются варианты ответа, вид возвращается к собеседнику (при выключенном приближении). Нужен «Поворот друг к другу в диалоге»."
"Grass fires" = "Пожары в траве"
"On: flamers, incendiary rounds and fire blasts set grass alight; the fire spreads and burns whoever stands in it. Off: fire stays where it hits." = "Вкл.: огнемёты, зажигательные патроны и огненные взрывы поджигают траву; огонь расходится и жжёт всех, кто в нём стоит. Выкл.: огонь остаётся там, куда попал."
"Play Music" = "Музыка"
"Sounds of the world cover your noise" = "Звуки мира заглушают ваш шум"
"On: while a louder sound plays near you (machines, voices, shots, creatures), the noise you make is not heard. Not in the original." = "Вкл.: пока рядом звучит что-то громче (машины, голоса, выстрелы, существа), ваш шум не слышен. Нет в оригинале."
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed, 0% not at all. Enemies attack at anything less than a stop." = "Насколько замедляется мир, пока вы выбираете цели в классическом режиме: 100% — останавливается, 50% — идёт вполовину, 0% — не замедляется. Если мир не стоит, враги атакуют."
"Reports already sent" = "Уже отправленные отчёты"
"Delete them now asks the server to delete every report this PC sent (within 7 days) and drops unsent ones; later reports get a new ID." = "«Удалить сейчас» просит сервер удалить все отчёты с этого ПК (за 7 дней) и стирает неотправленные; новые отчёты получат новый ID."
"Send reports to help fix NVForever" = "Отправлять отчёты, чтобы помочь исправить NVForever"
"Terrain wireframe" = "Сетка рельефа"
"Counter: last figure" = "Счётчик: последнее число"
"The frame rate row's last figure, over 10 seconds: 1% low (the mean of the slowest hundredth of frames) or the slowest frame." = "Последнее число строки частоты кадров за 10 секунд: 1% низких (среднее самой медленной сотой доли кадров) или самый медленный кадр."
"How far from you the sun casts shadows, as a part of the farthest shadow distance; 0%: none." = "На каком расстоянии от вас солнце отбрасывает тени, как доля наибольшей дальности теней; 0% — нигде."
"FSR library" = "Библиотека FSR"
"What FSR upscales with: NVForever's built-in FSR 3.1, or a FidelityFX library in the game's folder (for tools that replace the upscaler)." = "Чем FSR масштабирует: встроенный в NVForever FSR 3.1 или библиотека FidelityFX в папке игры (для программ, подменяющих масштабирование)."
"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Shown while no upscaler is chosen." = "Как сглаживаются края: мультисэмплинг 2x, 4x или 8x (каждый шаг дороже) или FXAA, SMAA или TAA после отрисовки. Показано, пока масштабирование не выбрано."
"Latency reduction" = "Снижение задержки"
"The graphics driver keeps the game from preparing frames ahead (AMD Anti-Lag, NVIDIA low latency), meant to show what you do sooner. Not in the original." = "Драйвер видеокарты не даёт игре готовить кадры заранее (AMD Anti-Lag, NVIDIA low latency), чтобы ваши действия появлялись на экране раньше. Нет в оригинале."
