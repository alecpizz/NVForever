"A grenade or thrown weapon is wound up and held while you hold attack, and thrown when you let go. (Stewie's Tweaks bHoldAndReleaseThrowables)" = "按住攻击键时，手榴弹或投掷武器会举起待投，松开按键时才会掷出。 (Stewie's Tweaks bHoldAndReleaseThrowables)"
"Enemies Can Disarm You" = "敌人可打落你的武器"
"A hit that cripples one of your arms knocks the weapon from your hand to the ground, as yours does to them. (Stewie's Tweaks bNPCsCanDisarmPlayer)" = "与玩家可以打落敌人的武器一样，若一击使你的某条手臂重伤，手中的武器便会掉到地上。 (Stewie's Tweaks bNPCsCanDisarmPlayer)"
"NPCs Drop Live Grenades" = "非玩家角色死亡时掉落已启动的手榴弹"
"Someone killed with a grenade in hand drops it live at their feet, where it goes off. (Stewie's Tweaks bNPCsDropLiveGrenades)" = "手持手榴弹的角色被杀时，手榴弹会落在其脚边并在那里爆炸。 (Stewie's Tweaks bNPCsDropLiveGrenades)"
"Water Sources Show H2O" = "水源显示解渴量"
"A tap's or puddle's prompt shows how much H2O a drink takes off. (Stewie's Tweaks bWaterSourcesShowH2O)" = "水龙头或水坑的提示会显示喝一口能降低多少 H2O。 (Stewie's Tweaks bWaterSourcesShowH2O)"
"No Character Remake Offer" = "离开初始区域时不提示重建角色"
"Leaving Doc Mitchell's area does not offer to change your character. (Stewie's Tweaks bDisableCharacterRespec)" = "离开米切尔医生所在的区域时，不再询问是否修改角色。 (Stewie's Tweaks bDisableCharacterRespec)"
"Weapon Impact Effects" = "武器中弹效果"
"A shot that strikes the weapon in someone's hands sparks and sounds like metal, with no blood. (Stewie's Tweaks bWeaponImpactEffects)" = "打中他人手里的武器时会溅出火花并发出金属声，不会有血迹。 (Stewie's Tweaks bWeaponImpactEffects)"
"Robot Companions Heal With Scrap Metal" = "用废金属修复机器人同伴"
"The companion wheel's Heal gives a robot companion Scrap Metal instead. (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal)" = "在同伴指令轮中选择「治疗」时，若同伴为机器人，则改用废金属。 (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal)"
"Scrap Metal: Health Each" = "废金属：单件恢复的生命值"
"Health one Scrap Metal gives a robot companion. (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal, fBase)" = "一件废金属为机器人同伴恢复的生命值。 (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal, fBase)"
"Scrap Metal: Health per 10 Repair" = "废金属：每 10 点修理技能的加成"
"Health added for each 10 points of your Repair skill. (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal, fRepairMult)" = "你的修理技能每达到 10 点，额外恢复的生命值。 (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal, fRepairMult)"
"Scrap Metal: Robotics Expert Bonus" = "废金属：「机器人专家」加成"
"Health added when you have Robotics Expert. (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal, fRoboticsExpertBonus)" = "拥有「机器人专家」专长时，额外恢复的生命值。 (Stewie's Tweaks bRobotCompanionsHealWithScrapMetal, fRoboticsExpertBonus)"
"No Weapon Movement Penalty" = "武器不再降低移动速度"
"A drawn two-handed weapon does not slow the player's run. (Stewie's Tweaks bNoEquippedWeaponMovementPenalty)" = "举起双手武器时，玩家的奔跑速度不会降低。 (Stewie's Tweaks bNoEquippedWeaponMovementPenalty)"
"Unequip Broken Armour" = "自动卸下损坏的护甲"
"The player's armour is taken off when it breaks, staying in the inventory. (Stewie's Tweaks bUnequipBrokenArmor)" = "玩家的护甲损坏时会自动卸下，但仍保留在物品栏。 (Stewie's Tweaks bUnequipBrokenArmor)"
"No Crosshair in First Person" = "第一人称隐藏准星"
"The crosshair is not drawn in first person; the activation prompt stays. (Stewie's Tweaks bHideCrosshairInFirstPerson)" = "第一人称下不显示准星，仍显示交互提示。 (Stewie's Tweaks bHideCrosshairInFirstPerson)"
"No Crosshair in Third Person" = "第三人称隐藏准星"
"The crosshair is not drawn in third person; the activation prompt stays. (Stewie's Tweaks bHideCrosshairInThirdPerson)" = "第三人称下不显示准星，仍显示交互提示。 (Stewie's Tweaks bHideCrosshairInThirdPerson)"
"No Skill Books at 100" = "技能满 100 点时不读技能书"
"A skill book whose skill is already at 100 is not read from the Pip-Boy, so it is not wasted. (Stewie's Tweaks bNoSkillBooksAbove100)" = "若对应技能已达到 100 点，则无法在 Pip-Boy 中阅读该技能书，避免浪费。 (Stewie's Tweaks bNoSkillBooksAbove100)"
"Red Health Bar Below" = "生命值条变红阈值"
"The HUD's health bar turns red below this share of health; 0% never. (Stewie's Tweaks bColoredHUDBars)" = "生命值低于此百分比时，界面上的生命值条变红。设为 0% 时永不变红。 (Stewie's Tweaks bColoredHUDBars)"
"Red Action Point Bar Below" = "行动点数条变红阈值"
"The HUD's Action Point bar turns red below this share; 0% never. (Stewie's Tweaks bColoredHUDBars)" = "行动点数低于此百分比时，界面上的行动点数条变红。设为 0% 时永不变红。 (Stewie's Tweaks bColoredHUDBars)"
"Red Weapon Condition Below" = "武器耐久度变红阈值"
"The HUD's weapon condition bar turns red below this condition; 0% never. (Stewie's Tweaks bColorWeaponCndLabel)" = "武器耐久度低于此百分比时，界面上的武器耐久度条变红。设为 0% 时永不变红。 (Stewie's Tweaks bColorWeaponCndLabel)"
"Flashing Weapon Condition Below" = "武器耐久度闪红阈值"
"The HUD's weapon condition bar flashes red below this condition; 0% never. (Stewie's Tweaks bColorWeaponCndLabel)" = "武器耐久度低于此百分比时，界面上的武器耐久度条闪红。设为 0% 时永不闪红。 (Stewie's Tweaks bColorWeaponCndLabel)"
"Blackjack Hand Total" = "二十一点显示手牌点数"
"The Blackjack screen shows the total of the hand being played. (Stewie's Tweaks bBlackJackTotalDisplay)" = "二十一点界面显示当前这手牌的总点数。 (Stewie's Tweaks bBlackJackTotalDisplay)"
"Less Frequent Pain Sounds" = "受伤喊声的最短间隔"
"Seconds after a pain sound before the player makes another; 0 changes nothing. (Stewie's Tweaks bLessFrequentPlayerPainSounds)" = "玩家发出一次受伤喊声后，至少经过此秒数才会再次喊出。设为 0 时保持默认。 (Stewie's Tweaks bLessFrequentPlayerPainSounds)"
"Pause On Load" = "读取存档后暂停"
"A loaded save starts in the pause menu instead of straight into play. (Stewie's Tweaks bPauseOnSaveLoad)" = "读取存档后先进入暂停菜单。 (Stewie's Tweaks bPauseOnSaveLoad)"
"Swap Ammo While Holstered" = "收起武器时也可切换弹药"
"Ammo Swap changes the ammo type with the weapon put away; it reloads when drawn. (Stewie's Tweaks bSwapAmmoWithWeaponHolstered)" = "武器收起时，按「切换弹药」键可改变弹药类型。举起武器后会重新装填。 (Stewie's Tweaks bSwapAmmoWithWeaponHolstered)"
"Slots: Hold to Spin" = "长按连续转动老虎机"
"Holding W at a slot machine spins it again each time the reels stop. (Stewie's Tweaks bSlotsAutoSpinHotkey)" = "在老虎机前按住 W 键，转轮每次停下后都会再次转动。 (Stewie's Tweaks bSlotsAutoSpinHotkey)"
"Click to Continue Dialogue" = "点击后继续对话"
"In a conversation each line waits for a click before the next, giving time to read. (Stewie's Tweaks bNoAutoContinueDialog)" = "交谈中每句台词都会等到你点击后才继续，让你有时间阅读。 (Stewie's Tweaks bNoAutoContinueDialog)"
"Shift to Talk While Sneaking" = "潜行时按住 Shift 交谈"
"While sneaking, holding Shift talks to a person instead of picking their pocket. (Stewie's Tweaks bTalkWhileSneakingIfShiftIsHeld)" = "潜行时按住 Shift 键，与角色互动会开始交谈，而非扒窃。 (Stewie's Tweaks bTalkWhileSneakingIfShiftIsHeld)"
"No Active Quest From New Objectives" = "新目标不自动激活任务"
"With no quest active, a new objective does not make its quest the active one. (Stewie's Tweaks bDontSetQuestWhenObjectivesAdded)" = "没有当前任务时，新出现的目标不会把其所属任务自动设为当前任务。 (Stewie's Tweaks bDontSetQuestWhenObjectivesAdded)"
"No Active Quest After Completing One" = "完成任务后不自动切换"
"When the active quest is done, no other quest becomes active by itself. (Stewie's Tweaks bDontSetQuestWhenCompletingObjectives)" = "当前任务完成后，不会自动激活其他任务。 (Stewie's Tweaks bDontSetQuestWhenCompletingObjectives)"
"Hide Read Notes" = "隐藏已读笔记"
"The Pip-Boy's notes list leaves out notes already read. (Stewie's Tweaks bHideReadNotes)" = "Pip-Boy 的笔记列表不显示已读笔记。 (Stewie's Tweaks bHideReadNotes)"
"Tab Closes Terminals" = "按 Tab 关闭终端"
"Tab closes a terminal from any page instead of going back a page (Backspace still goes back). (Stewie's Tweaks bTabClosesTerminals)" = "在终端任意页面按 Tab 都会关闭终端。仍可用 Backspace 返回上一页。 (Stewie's Tweaks bTabClosesTerminals)"
"Tab Goes Back in the Pause Menu" = "暂停菜单中按 Tab 返回"
"Tab goes back a page in the pause menu, as Backspace does (the Settings and Controls pages keep Tab for their tabs). (Stewie's Tweaks bTabBackInStartMenu)" = "暂停菜单中可像按 Backspace 一样按 Tab 返回上一级。设置页和控制页仍用 Tab 切换标签页。 (Stewie's Tweaks bTabBackInStartMenu)"
"Fast Travel From Anywhere" = "可从任何地点快速旅行"
"Fast travel works from places flagged against it, such as interiors; leaving a scripted place this way can break it. (Stewie's Tweaks bAllowUnsafeFastTravel)" = "可从室内等标记为禁止快速旅行的地点出发。以此方式离开由脚本控制的地点可能使脚本无法正常运行。 (Stewie's Tweaks bAllowUnsafeFastTravel)"
"V.A.T.S. Starts on the Head" = "V.A.T.S. 默认瞄准头部"
"In the classic V.A.T.S., a target's head is selected first rather than the part easiest to hit. (Stewie's Tweaks bVATSAutoTargetHead)" = "经典 V.A.T.S. 首先选中目标头部，而非最易命中的部位。 (Stewie's Tweaks bVATSAutoTargetHead)"
"V.A.T.S. Drops Shots at a Lost Weapon" = "武器脱手后取消 V.A.T.S. 攻击"
"Attacks queued in V.A.T.S. on someone's weapon are not played once they no longer hold it. (Stewie's Tweaks bVATSDequeueWeaponShotsOnDisarm)" = "若对方不再持有其武器，就不再执行 V.A.T.S. 中对该武器预先安排的攻击。 (Stewie's Tweaks bVATSDequeueWeaponShotsOnDisarm)"
"Target Projectiles in V.A.T.S." = "V.A.T.S. 可瞄准投射物"
"V.A.T.S. can mark projectiles in flight: explosives go off, others end; odds: distance, skill. (Stewie's Tweaks bTargetProjectilesInVATS)" = "V.A.T.S. 可标记飞行中的投射物。命中后，爆炸物会引爆，其他投射物会被消除。命中率取决于距离和技能。 (Stewie's Tweaks bTargetProjectilesInVATS)"
"Target Projectiles: Mines Too" = "V.A.T.S. 也可瞄准地雷"
"With Target Projectiles in V.A.T.S., mines can be marked too, thrown or lying armed. (Stewie's Tweaks bTargetProjectilesInVATS, bMines)" = "开启「V.A.T.S. 可瞄准投射物」后，也可标记投掷中的地雷或已布设在地上的地雷。 (Stewie's Tweaks bTargetProjectilesInVATS, bMines)"
"V.A.T.S. Targets Your Own Projectiles" = "V.A.T.S. 可瞄准自己的投射物"
"With Target Projectiles in V.A.T.S., your own projectiles can be marked too. (Stewie's Tweaks bVATSTargetPlayerProjectiles)" = "开启「V.A.T.S. 可瞄准投射物」后，也可标记自己发出的投射物。 (Stewie's Tweaks bVATSTargetPlayerProjectiles)"
"V.A.T.S. Ignores Non-Explosive Projectiles" = "V.A.T.S. 忽略非爆炸性投射物"
"With Target Projectiles in V.A.T.S., only projectiles with an explosion can be marked. (Stewie's Tweaks bVATSIgnoreNonExplosiveProjectiles)" = "开启「V.A.T.S. 可瞄准投射物」后，只允许标记可爆炸的投射物。 (Stewie's Tweaks bVATSIgnoreNonExplosiveProjectiles)"
"V.A.T.S. Burst Stops on a Kill" = "V.A.T.S. 击杀后停止连发"
"The rest of a burst in V.A.T.S. is not fired once its target is dead. (Stewie's Tweaks bVATSStopBurstIfTargetDead)" = "目标死亡后，V.A.T.S. 不会打出本轮连发中剩余的弹药。 (Stewie's Tweaks bVATSStopBurstIfTargetDead)"
"Repair Needs the Weapon's Skill" = "修理需达到武器的技能要求"
"The player can repair a weapon only with Repair at least the weapon's skill requirement. (Stewie's Tweaks bRepairRequiresWeaponSkill)" = "玩家的修理技能至少达到武器要求的技能值，才能修理该武器。 (Stewie's Tweaks bRepairRequiresWeaponSkill)"
"Date Format" = "日期格式"
"How the Pip-Boy and the wait menu write the date. (Stewie's Tweaks iDateFormat)" = "Pip-Boy 和等待菜单显示日期时采用的格式。 (Stewie's Tweaks iDateFormat)"
"Hide Unknown Names" = "隐藏陌生角色的姓名"
"The activation prompt gives no name for someone who has not spoken to the player yet (bodies are still named). (Stewie's Tweaks bHideUnknownNPCNames)" = "如果某人从未与玩家交谈，交互提示不显示其姓名。尸体仍会显示姓名。 (Stewie's Tweaks bHideUnknownNPCNames)"
"V.A.T.S. Puts the Weapon Back" = "V.A.T.S. 结束后收起武器"
"A weapon that V.A.T.S. drew is put away again when the mode ends with nothing fired. (Stewie's Tweaks bEnteringVATSDoesntUnholsterWeapon)" = "若 V.A.T.S. 举起了武器但全程未开火，退出时会再次收起该武器。 (Stewie's Tweaks bEnteringVATSDoesntUnholsterWeapon)"
"No Hotkey Wheel" = "禁用快捷键武器轮"
"Holding a hotkey does not open the weapon wheel; letting go uses the slot as a tap does. (Stewie's Tweaks bNoHUDHotkeyPopup)" = "按住快捷键不会打开武器轮。松开后会像轻按一样使用该栏位。 (Stewie's Tweaks bNoHUDHotkeyPopup)"
"Ammo Label Under the Count" = "弹药类型显示在数量下方"
"The HUD writes the ammo type under the ammo count instead of beside it. (Stewie's Tweaks bMoveAmmoTypeLabel)" = "界面会把弹药类型移到弹药数量下方。 (Stewie's Tweaks bMoveAmmoTypeLabel)"
"Companion Compass Colour" = "同伴罗盘标记颜色"
"The colour of companions' marks on the compass; Off leaves them as anyone's. (Stewie's Tweaks bCompanionPipColorChange)" = "同伴在罗盘上的标记颜色。设为「关闭」时仍与其他角色相同。 (Stewie's Tweaks bCompanionPipColorChange)"
"Facial Hair for Women" = "女性角色可留胡须"
"The character creator and the barber offer facial hair to a woman too. (Stewie's Tweaks bRaceMenuAllowFemaleFacialHair)" = "创建女性角色或为女性角色理发时，也可选择胡须样式。 (Stewie's Tweaks bRaceMenuAllowFemaleFacialHair)"
"Show Use Password" = "有密码时显示解锁提示"
"A locked terminal whose password note the player holds says so in its prompt until first opened. (Stewie's Tweaks bShowUsePasswordOnTerminalsWithNote)" = "若玩家持有锁定终端的密码笔记，交互提示会提示可使用密码，直到首次解锁。 (Stewie's Tweaks bShowUsePasswordOnTerminalsWithNote)"
"Lockpicking With the Movement Keys" = "使用移动键撬锁"
"Lockpicking: strafe moves the pin (Shift fast, Ctrl slow), Forward, Back, Jump the driver. (Stewie's Tweaks bLockPickMenuKeyboardMovement)" = "撬锁时，平移键可拨动发夹（Shift 加速，Ctrl 减速），前进、后退和跳跃键可转动螺丝刀。 (Stewie's Tweaks bLockPickMenuKeyboardMovement)"
"Store All" = "全部存入"
"In a container, Shift with Take All stores everything listed but what is worn or a quest's. (Stewie's Tweaks bContainerMenuStoreAllHotkey)" = "在容器界面，按住 Shift 键使用「全部拿取」，可将列出的所有物品存入容器，已穿戴的物品和任务物品除外。 (Stewie's Tweaks bContainerMenuStoreAllHotkey)"
"Map Recentre Key" = "地图重新居中键"
"C puts the Pip-Boy's local or world map back on the player after it was dragged. (Stewie's Tweaks bMapRecenterHotkey)" = "拖动 Pip-Boy 的区域地图或世界地图后，按 C 键可将地图重新对准玩家。 (Stewie's Tweaks bMapRecenterHotkey)"
"Map Marker Distance" = "显示地图标记距离"
"The World Map says how far the marker under the pointer is from the player. (Stewie's Tweaks bMapLocationDisplayDistance)" = "世界地图显示指针下方的标记与玩家相距多远。 (Stewie's Tweaks bMapLocationDisplayDistance)"
"Quantity Box Shows the Price" = "数量窗口显示价格"
"In a barter, the \"How many?\" box says what the amount costs. (Stewie's Tweaks bBarterQuantityMenuShowsPrice)" = "交易时，「多少件？」窗口显示所选数量的总价。 (Stewie's Tweaks bBarterQuantityMenuShowsPrice)"
"Quantity Box Shows the Weight" = "数量窗口显示重量"
"In a container, the \"How many?\" box says what the amount weighs. (Stewie's Tweaks bContainerQuantityMenuShowsWeight)" = "查看容器时，「多少件？」窗口显示所选数量的总重量。 (Stewie's Tweaks bContainerQuantityMenuShowsWeight)"
"Hide an Empty Reputation List" = "隐藏空白声望列表"
"With no reputations yet, the Stats page's General tab shows the statistics only, with no switch to the reputations. (Stewie's Tweaks bHideReputationTabIfEmpty)" = "尚未获得任何声望时，「状态」页的「常规」标签只显示统计数据，无法切换到声望列表。 (Stewie's Tweaks bHideReputationTabIfEmpty)"
"Quick Load From the Menus" = "可在菜单中快速读档"
"The QuickLoad key loads the quicksave from the main and pause menus too. (Stewie's Tweaks bStartMenuQuickLoad)" = "在主菜单和暂停菜单中也可按「快速读档」键读取快速存档。 (Stewie's Tweaks bStartMenuQuickLoad)"
"Preview Perks on Level Up" = "升级时可预览专长"
"A level-up without a perk still shows the perks page, to look at with none to take. (Stewie's Tweaks bPreviewPerksOnLevelUp)" = "即使本次升级无法选择专长，也会显示专长页供查看。 (Stewie's Tweaks bPreviewPerksOnLevelUp)"
"Pick Locks Even With the Key" = "有钥匙时仍可撬锁"
"Holding Shift, a lock the player has the key of opens the lockpicking game instead. (Stewie's Tweaks bPickLocksEvenWithKey)" = "按住 Shift 键与锁互动，即使玩家有钥匙，也会进入撬锁小游戏。 (Stewie's Tweaks bPickLocksEvenWithKey)"
"Right Click for the Previous Category" = "右键返回上一个分类"
"In a container or a barter, a right click on a list's heading goes back a category. (Stewie's Tweaks bRightClickChangesToPreviousContainerCategory)" = "查看容器或交易时，右键点击列表标题可返回上一个分类。 (Stewie's Tweaks bRightClickChangesToPreviousContainerCategory)"
"Mark Notes Unread" = "将笔记标为未读"
"A right click on a note in the Pip-Boy marks it unread again. (Stewie's Tweaks bMarkNotesUnread)" = "在 Pip-Boy 中右键点击笔记，即可重新将其标为未读。 (Stewie's Tweaks bMarkNotesUnread)"
"Barter Total Past the Merchant's Caps" = "显示超过商人瓶盖数的总价"
"Barter shows the whole total past the merchant's caps, though it pays only those. (Stewie's Tweaks bShowBarterTotalWhenOverSellLimit)" = "即使交易总价超过商人所持的瓶盖数，也会显示完整总价。商人实际只支付手头的瓶盖。 (Stewie's Tweaks bShowBarterTotalWhenOverSellLimit)"
"Compass Fades on the Left" = "罗盘标记在左侧淡出"
"Marks on the compass fade toward its left end (quest marks stay whole), for a compass seen from its middle. (Stewie's Tweaks bCompassFadeLeftSide)" = "罗盘标记越靠近左端越淡，适合从中间观看的罗盘。任务标记不受影响。 (Stewie's Tweaks bCompassFadeLeftSide)"
"Controller Dead Zones" = "自定义手柄摇杆死区"
"The sticks use the dead zones below instead of the game's (12% of a push); 0% takes every movement. (Stewie's Tweaks bDisableControllerDeadzones)" = "用下方的死区设置取代游戏原有的 12% 摇杆死区。设为 0% 时响应所有动作。 (Stewie's Tweaks bDisableControllerDeadzones)"
"Left Stick Dead Zone" = "左摇杆死区"
"The share of a push the left stick ignores, with Controller Dead Zones on. (Stewie's Tweaks iControllerDeadzone)" = "开启「自定义手柄摇杆死区」时，左摇杆在此推杆幅度内不响应。 (Stewie's Tweaks iControllerDeadzone)"
"Right Stick Dead Zone" = "右摇杆死区"
"The share of a push the right stick ignores, with Controller Dead Zones on. (Stewie's Tweaks iControllerDeadzoneRS)" = "开启「自定义手柄摇杆死区」时，右摇杆在此推杆幅度内不响应。 (Stewie's Tweaks iControllerDeadzoneRS)"
"Trigger Dead Zones" = "自定义扳机死区"
"LT and RT count as pressed at the points below instead of three quarters down. (Stewie's Tweaks bControllerTriggerDeadzones)" = "LT 和 RT 达到下方设定的行程即视为按下。游戏原有阈值为四分之三行程。 (Stewie's Tweaks bControllerTriggerDeadzones)"
"Left Trigger Press Point" = "左扳机触发点"
"How far LT goes down before it counts as pressed, with Trigger Dead Zones on. (Stewie's Tweaks iDeadzoneLT)" = "开启「自定义扳机死区」时，LT 需按下多少行程才会触发。 (Stewie's Tweaks iDeadzoneLT)"
"Right Trigger Press Point" = "右扳机触发点"
"How far RT goes down before it counts as pressed, with Trigger Dead Zones on. (Stewie's Tweaks iDeadzoneRT)" = "开启「自定义扳机死区」时，RT 需按下多少行程才会触发。 (Stewie's Tweaks iDeadzoneRT)"
"More Responsive Controller Aiming" = "提高手柄瞄准响应"
"Right-stick turning grows in a line past the dead zone, not squared: small pushes count. (Stewie's Tweaks bMoreResponsiveControllerAiming)" = "超出死区后，右摇杆的转向速度随推杆幅度线性增长，取代平方曲线。轻推也能明显转动视角。 (Stewie's Tweaks bMoreResponsiveControllerAiming)"
"Faster Controller Camera Circling" = "加快镜头环绕速度"
"With a controller, the camera circles the player twice as fast while Toggle POV is held. (Stewie's Tweaks bFasterControllerPOVRotate)" = "使用手柄时，按住「切换视角」键可使镜头以两倍速度绕玩家旋转。 (Stewie's Tweaks bFasterControllerPOVRotate)"
"Vanity Camera Returns to First Person" = "环绕镜头结束后恢复第一人称"
"A first-person view comes back after the circling camera (idle, Toggle POV held). (Stewie's Tweaks bVanityCamReturnsToFirstPerson)" = "待机或按住「切换视角」键触发环绕镜头后，如果先前为第一人称，镜头结束时恢复第一人称。 (Stewie's Tweaks bVanityCamReturnsToFirstPerson)"
"Horizontal Look Speed" = "水平视角速度"
"Left and right look speed apart from up and down, on top of the sensitivity; x1.0 changes nothing. (Stewie's Tweaks bSeparateHorizontalSensitivity)" = "在已有灵敏度的基础上单独调整水平转向速度。x1.0 保持原速度。 (Stewie's Tweaks bSeparateHorizontalSensitivity)"
"Shift Ignores Friends in V.A.T.S." = "按住 Shift 时 V.A.T.S. 忽略友方"
"Holding Shift, V.A.T.S. marks no one who would not fight the player. (Stewie's Tweaks bShiftIgnoresFriendlyVATS)" = "按住 Shift 键时，V.A.T.S. 不会标记任何不会与玩家交战的角色。 (Stewie's Tweaks bShiftIgnoresFriendlyVATS)"
"Remember Console History" = "记住控制台输入历史"
"The console's entered lines are kept between runs, in ConsoleHistory.txt in NVForever's folder. (Stewie's Tweaks bRememberConsoleHistory)" = "控制台输入记录保存在 NVForever 文件夹中的 ConsoleHistory.txt，重新启动后仍可使用。 (Stewie's Tweaks bRememberConsoleHistory)"
"Console Output File" = "写入控制台输出文件"
"Console lines are added to ConsoleOutput.txt in NVForever's folder from the start. (Stewie's Tweaks bUseConsoleOutputFile)" = "从启动开始，控制台输出会追加到 NVForever 文件夹中的 ConsoleOutput.txt。 (Stewie's Tweaks bUseConsoleOutputFile)"
"Console Text Shadow" = "控制台文字阴影"
"The console's lines are a darker green over a faint shadow, easier to read on a bright view. (Stewie's Tweaks bConsoleTextShadow)" = "控制台文字改用较深的绿色并加上淡阴影，在明亮画面上更容易阅读。 (Stewie's Tweaks bConsoleTextShadow)"
"Press to Leave Loading Screens" = "按键退出加载画面"
"A loading screen stays up once everything is in until a key or a button is pressed. (Stewie's Tweaks bClickToExitLoadScreens)" = "加载完成后仍保留加载画面，直到按下键盘或手柄上的按键。 (Stewie's Tweaks bClickToExitLoadScreens)"
"Keep Stations Out of Range" = "保留超出接收范围的电台"
"Received stations stay on the Pip-Boy's list out of range; tuned to one, it plays once received again. (Stewie's Tweaks bSelectUnavailableRadios)" = "接收过的电台即使超出范围，也会保留在 Pip-Boy 的电台列表中。若仍选中该台，重新进入接收范围后会恢复播放。 (Stewie's Tweaks bSelectUnavailableRadios)"
"Radiation Brings Radio Static" = "辐射造成电台杂音"
"Taking radiation brings static into the Pip-Boy's radio, more the faster the rads come. (Stewie's Tweaks bRadiationCausesRadioStatic)" = "受到辐射时，Pip-Boy 电台会出现杂音。辐射累积越快，杂音越大。 (Stewie's Tweaks bRadiationCausesRadioStatic)"
"Barter Shows Caps After" = "交易时显示成交后瓶盖数"
"In a barter, each side's caps after the trade are shown beside its caps now. (Stewie's Tweaks bBarterShowCapsChange)" = "交易中，界面会在双方当前的瓶盖数旁显示成交后各自剩余的瓶盖数。 (Stewie's Tweaks bBarterShowCapsChange)"
"No Self Meltdown Damage" = "「熔毁」不伤及己方"
"Blasts given off by the Meltdown perk hurt neither the player nor the companions. (Stewie's Tweaks bNoSelfMeltdownDamage)" = "「熔毁」专长引发的爆炸不会伤害玩家或同伴。 (Stewie's Tweaks bNoSelfMeltdownDamage)"
"Level Cap" = "等级上限"
"The highest level the player can reach, with no levels added for the add-ons; 0 keeps the game's. (Stewie's Tweaks iMaxCharacterLevel)" = "玩家能达到的最高等级，附加内容不会再提高这个上限。设为 0 时沿用游戏原有上限。 (Stewie's Tweaks iMaxCharacterLevel)"
"Sneak Attacks Standing" = "站立时也可发动潜行攻击"
"An attack on someone who has not detected the player is a sneak attack without crouching too. (Stewie's Tweaks bSneakAttackWithoutCrouching)" = "攻击尚未察觉玩家的角色时，即使没有蹲下也算潜行攻击。 (Stewie's Tweaks bSneakAttackWithoutCrouching)"
"No Companion Item Damage" = "同伴武器不会磨损"
"The companions' weapons do not wear with use. (Stewie's Tweaks bNoCompanionItemDamage)" = "同伴使用武器不会降低其耐久度。 (Stewie's Tweaks bNoCompanionItemDamage)"
"Weapon Mods Need the Skill" = "武器改装需要满足技能要求"
"A weapon can be modded only by a player who meets its skill requirement. (Stewie's Tweaks bWeaponModdingSkillRequirement)" = "只有玩家达到武器的技能要求，才能改装该武器。 (Stewie's Tweaks bWeaponModdingSkillRequirement)"
"Planting Grenades Needs the Skill" = "布置手榴弹需要满足技能要求"
"A grenade or mine placed in someone's pocket goes live only if the player meets its skill requirement. (Stewie's Tweaks bPlantingLiveGrenadesRequiresWeaponSkill)" = "只有玩家达到手榴弹或地雷的技能要求，放入他人口袋的爆炸物才会被启动。 (Stewie's Tweaks bPlantingLiveGrenadesRequiresWeaponSkill)"
"Fast Travel Costs a Nuka-Cola" = "快速旅行消耗核子可乐"
"Each fast travel takes a Nuka-Cola Quantum, Quartz or Victory, and is refused without one. (Stewie's Tweaks bFastTravelCostsSpecialNukaBottles)" = "每次快速旅行会消耗一瓶量子、水晶或胜利核子可乐。未携带任一种时无法快速旅行。 (Stewie's Tweaks bFastTravelCostsSpecialNukaBottles)"
"Jump Swims Upwards" = "按跳跃键向上游"
"Holding Jump under water swims up, at the walking stroke's speed. (Stewie's Tweaks bJumpSwimsUpwards)" = "在水下按住「跳跃」键可向上游，速度与普通划水相同。 (Stewie's Tweaks bJumpSwimsUpwards)"
"Armour Causes Sinking" = "护甲会使玩家下沉"
"Medium and heavy body armour pull the player down in water (heavy faster). (Stewie's Tweaks bArmorCausesSinking)" = "身穿中型或重型护甲时，玩家在水中会下沉。重型护甲下沉得更快。 (Stewie's Tweaks bArmorCausesSinking)"
"Remember Bobby Pin Wear" = "记住发夹磨损"
"The bobby pin keeps its wear from one lock to the next, kept in the save. (Stewie's Tweaks bRememberBobbyPinHealth)" = "换一把锁继续撬时，发夹仍保留原有磨损。该状态也会保存到存档中。 (Stewie's Tweaks bRememberBobbyPinHealth)"
"Forcing Breaks the Pin, Not the Lock" = "强行开锁失败时只损坏发夹"
"A failed Force Lock breaks the bobby pin in it and the lock can be tried again. (Stewie's Tweaks bForceLockpickNoBreakLock)" = "强行开锁失败会折断发夹，仍可再次尝试开锁。 (Stewie's Tweaks bForceLockpickNoBreakLock)"
"No Condition Damage Penalty" = "武器伤害不受耐久度影响"
"Weapons deal their full damage whatever their condition. (Stewie's Tweaks bNoWeaponConditionDamagePenalty)" = "无论耐久度如何，武器都能造成完好状态下的伤害。 (Stewie's Tweaks bNoWeaponConditionDamagePenalty)"
"No Condition Damage Buffer" = "武器一经磨损便降低伤害"
"A weapon's damage falls as soon as its condition is below full, not only below 75%. (Stewie's Tweaks bRemoveWeaponDamageBuffer)" = "武器耐久度低于满值时，伤害便开始下降。游戏原有阈值为 75%。 (Stewie's Tweaks bRemoveWeaponDamageBuffer)"
"Automatic Criticals Not Cut by Fire Rate" = "自动武器暴击率不受射速影响"
"Automatic weapons' critical chance is not divided by their rate of fire. (Stewie's Tweaks bCritChanceIgnoresFireRate)" = "计算自动武器的暴击率时，不再除以射速。 (Stewie's Tweaks bCritChanceIgnoresFireRate)"
"Critical Damage" = "暴击额外伤害倍率"
"Every critical hit's added damage is multiplied by this; x1.0 changes nothing. (Stewie's Tweaks bScaleCriticalDamage)" = "每次暴击造成的额外伤害均乘以此倍率。x1.0 保持原值。 (Stewie's Tweaks bScaleCriticalDamage)"
"NPC Armour DR Ignores Condition" = "非玩家角色护甲抗性不受磨损影响"
"An NPC's armour keeps its whole Damage Resistance however worn. (Stewie's Tweaks bNoScaleNpcDamageResistanceByCondition)" = "无论护甲磨损程度如何，非玩家角色的护甲始终保有完好时的伤害抗性。 (Stewie's Tweaks bNoScaleNpcDamageResistanceByCondition)"
"NPC Armour DT Ignores Condition" = "非玩家角色护甲阈值不受磨损影响"
"An NPC's armour keeps its whole Damage Threshold however worn. (Stewie's Tweaks bNoScaleNpcDamageThresholdByCondition)" = "无论护甲磨损程度如何，非玩家角色的护甲始终保有完好时的伤害阈值。 (Stewie's Tweaks bNoScaleNpcDamageThresholdByCondition)"
"Explosion Radius Buff" = "扩大爆炸的全伤害范围"
"The inner 30% of an explosion's radius deals full damage, falling to 20% at the edge. (Stewie's Tweaks bExplosionRadiusBuff)" = "爆炸半径内侧 30% 的范围造成全额伤害，向外逐渐衰减，至边缘时为 20%。 (Stewie's Tweaks bExplosionRadiusBuff)"
"NPCs Sneak Attack the Player" = "非玩家角色可对玩家发动潜行攻击"
"An NPC the player has not detected lands sneak attack criticals on them, as the player does. (Stewie's Tweaks bNPCsCanSneakCritPlayer)" = "如果玩家没有发现某个非玩家角色，该角色也能对玩家造成潜行暴击。 (Stewie's Tweaks bNPCsCanSneakCritPlayer)"
"Fatal Criticals Always Gib" = "致命暴击必定造成肢解"
"A killing critical hit that is no sneak attack always blows off or severs the part struck. (Stewie's Tweaks bFatalNonSneakCritsAlwaysGib)" = "若致命暴击并非潜行攻击，命中部位必定被炸飞或切断。 (Stewie's Tweaks bFatalNonSneakCritsAlwaysGib)"
"Deadly Falls Take the Legs" = "摔死时腿部会断离"
"An actor killed by a fall loses its legs, blown off where they can be. (Stewie's Tweaks bFallDeathsCauseDismemberment)" = "角色因坠落而死亡时会失去双腿。条件允许时，双腿会被炸飞。 (Stewie's Tweaks bFallDeathsCauseDismemberment)"
"Splash Kills Can Gib the Torso" = "爆炸击杀可能炸碎躯干"
"A blast kill by someone with Bloody Mess has a one-in-four chance to blow the torso apart. (Stewie's Tweaks bSplashDamageTorsoGibbing)" = "拥有「血肉横飞」专长的角色用爆炸击杀时，有四分之一的概率炸碎目标躯干。 (Stewie's Tweaks bSplashDamageTorsoGibbing)"
"NPCs Drop Holstered Weapons" = "角色死亡也掉落已收起的武器"
"An NPC that dies with its weapon put away drops it, as one with it drawn does. (Stewie's Tweaks bNPCsDropWeaponHolsteredWeapon)" = "非玩家角色死亡时，即使武器已经收起，也会像举在手中时一样掉落。 (Stewie's Tweaks bNPCsDropWeaponHolsteredWeapon)"
"NPCs Keep Spent Cases" = "非玩家角色保留空弹壳"
"NPCs keep the cases, hulls and drained cells their shots leave, as the player does, to be found on them. (Stewie's Tweaks bNPCsEarnAmmoCasings)" = "非玩家角色会像玩家一样留下射击后产生的空弹壳、霰弹壳和耗尽的能量电池，可从其身上搜到。 (Stewie's Tweaks bNPCsEarnAmmoCasings)"
"First Person V.A.T.S." = "第一人称 V.A.T.S."
"V.A.T.S.'s shots play in first person; the view comes back after. (Stewie's Tweaks bFirstPersonVATS)" = "V.A.T.S. 以第一人称播放射击过程，结束后恢复原有视角。 (Stewie's Tweaks bFirstPersonVATS)"
"No Spent Cases" = "不保留空弹壳"
"The player's shots leave no cases, hulls or drained cells in the inventory. (Stewie's Tweaks bNoAmmoCasings)" = "玩家开火后，物品栏中不再留下空弹壳、霰弹壳或耗尽的能量电池。 (Stewie's Tweaks bNoAmmoCasings)"
"Crosshair Down the Sights" = "用机械瞄具时保留准星"
"The crosshair stays on screen while aiming down iron sights; a scope still hides it. (Stewie's Tweaks bKeepCrosshairWhenAiming)" = "使用机械瞄具瞄准时，仍在屏幕上显示准星。使用瞄准镜时依然隐藏。 (Stewie's Tweaks bKeepCrosshairWhenAiming)"
"Move During V.A.T.S. Camera" = "V.A.T.S. 镜头播放时可移动"
"You can still walk and run while V.A.T.S.'s camera plays the shots; jumping, firing and aiming stay held. (Stewie's Tweaks bMoveDuringVATSPlayback)" = "V.A.T.S. 播放射击镜头时仍可步行和奔跑。跳跃、开火和瞄准仍被锁定。 (Stewie's Tweaks bMoveDuringVATSPlayback)"
"Whole-Stack Pickup Figures" = "拾取成组物品时显示总数值"
"Looking at a stack of items, the weight and value shown are the whole stack's, not one item's. (Stewie's Tweaks bBetterPickupPrompt)" = "查看一组物品时，显示整组的总重量和总价值。 (Stewie's Tweaks bBetterPickupPrompt)"
"Turn Further While Seated" = "坐姿扩大视角转动范围"
"Seated in first person, you can look 115 degrees to either side instead of 80. (Stewie's Tweaks bTurnFurtherWhileSeated)" = "坐下并采用第一人称视角时，左右各可转动 115 度，默认各为 80 度。 (Stewie's Tweaks bTurnFurtherWhileSeated)"
"No Turning Animation" = "禁用原地转身动画"
"Your character's body does not step round when you turn on the spot, so it does not slide on after you stop. (Stewie's Tweaks bNoTurningAnim)" = "玩家原地转动视角时，角色不会迈步转身，停止转动后也不会继续滑动。 (Stewie's Tweaks bNoTurningAnim)"
"No Landing Animation" = "禁用落地动画"
"Your character does not play a landing movement after a jump or a fall. (Stewie's Tweaks bRemoveLandingAnim)" = "跳起或坠落之后，玩家角色不再播放落地动作。 (Stewie's Tweaks bRemoveLandingAnim)"
"Compass: Only Mapped Places" = "罗盘只显示地图已有的未发现地点"
"A place you have not found yet shows on the compass only if it is already marked on your map. (Stewie's Tweaks bHideInvisibleUndiscoveredLocations)" = "尚未到访的地点只有已标在地图上时，才会显示在罗盘上。 (Stewie's Tweaks bHideInvisibleUndiscoveredLocations)"
"S.P.E.C.I.A.L. Machine: Start on Summary" = "S.P.E.C.I.A.L. 机器直接打开总览"
"The machine that sets your S.P.E.C.I.A.L. opens on its last page, all seven at once, instead of one page each. (Stewie's Tweaks bSkipVigorTesterSpecialPages)" = "设置 S.P.E.C.I.A.L. 的机器直接打开最后一页，同时显示全部七项属性，省去逐页查看。 (Stewie's Tweaks bSkipVigorTesterSpecialPages)"
"Scope Delay (ms)" = "瞄准镜显示延迟（毫秒）"
"Milliseconds (to 1000) a scope waits once zoomed before covering the screen; 0 shows it at once. (Stewie's Tweaks bScopeVisibilityDelay)" = "变焦完成后，瞄准镜画面覆盖屏幕前等待的时间，最长 1000 毫秒。设为 0 时立即显示。 (Stewie's Tweaks bScopeVisibilityDelay)"
"No Pointer Over Message Boxes" = "弹窗中隐藏鼠标指针"
"The mouse pointer is hidden while a message box is up; choose with the keys or the controller. (Stewie's Tweaks bHideCursorInMessageMenu)" = "消息窗口打开时隐藏鼠标指针。请用键盘或手柄选择。 (Stewie's Tweaks bHideCursorInMessageMenu)"
"No Pointer in Conversations" = "对话中隐藏鼠标指针"
"The mouse pointer is hidden over a conversation's choices; choose with keys, the wheel or the controller. (Stewie's Tweaks bHideCursorInDialog)" = "交谈选项上方不显示鼠标指针；可用按键、鼠标滚轮或手柄选择。 (Stewie's Tweaks bHideCursorInDialog)"
"Level Up: Wheel Sets Skills" = "升级时用滚轮调整技能"
"On level-up screens the mouse wheel raises or lowers the stat under the pointer. (Stewie's Tweaks bLevelUpScrollWheelSupport)" = "在升级页面，滚动鼠标滚轮会调高或调低指针所指的数值。 (Stewie's Tweaks bLevelUpScrollWheelSupport)"
"Compare Armor" = "对比护甲数值"
"A piece of armour's DT in the Pip-Boy shows the difference from what you wear in the same places. (Stewie's Tweaks bCompareArmorStats)" = "Pip-Boy 中护甲的伤害阈值会显示与当前相同部位所穿护甲的差值。 (Stewie's Tweaks bCompareArmorStats)"
"Detailed Stats" = "显示详细属性数值"
"In the Pip-Boy's stats, a raised or lowered value says by how much, as (+5) for (+), and values show past 10 and 100. (Stewie's Tweaks bMoreDetailedStatsMenu)" = "Pip-Boy 的状态页注明数值具体升降了多少，例如用（+5）取代（+），也显示超过 10 和 100 的数值。 (Stewie's Tweaks bMoreDetailedStatsMenu)"
"Lockpicking Follows the Time Speed" = "撬锁速度随游戏时间变化"
"When a script speeds up or slows down time, the lock turns and the pick wears at that speed too. (Stewie's Tweaks bTimescaleAffectsMinigames)" = "脚本加快或放慢游戏时间时，锁芯的转动与发夹的磨损也会按该速度进行。 (Stewie's Tweaks bTimescaleAffectsMinigames)"
"No Name Length Limit" = "取消姓名长度限制"
"Your character's name may be longer than 24 letters. (Stewie's Tweaks bNoPlayerNameLimit)" = "玩家角色的姓名可以超过 24 个字符。 (Stewie's Tweaks bNoPlayerNameLimit)"
"Activate Doesn't Stand Up" = "交互键不会让玩家起身"
"Seated or lying down, the activate key no longer gets you up; a movement key does. (Stewie's Tweaks bActivatingDoesntStandUp)" = "坐下或躺下时，按「交互」键不会起身。可按移动键起身。 (Stewie's Tweaks bActivatingDoesntStandUp)"
"Plain Screen Going Outside" = "前往室外时使用纯黑加载画面"
"Going outdoors loads behind a plain black screen, no picture or tip; loading a save is unchanged. (Stewie's Tweaks bNoExteriorLoadScreens)" = "前往户外时，加载画面为纯黑，不显示图片或提示。读取存档时仍沿用原画面。 (Stewie's Tweaks bNoExteriorLoadScreens)"
"Mark Repeating Challenges" = "标记可重复的挑战"
"A challenge that starts again each time it is done says \"(repeats)\" beside its progress in the Pip-Boy. (Stewie's Tweaks bRecurringChallengeIndicator)" = "完成后会重新开始的挑战，在 Pip-Boy 的进度旁标为「可重复」。 (Stewie's Tweaks bRecurringChallengeIndicator)"
"Hide Hotkeyed Items in Containers" = "容器界面隐藏已绑定快捷键的物品"
"Things on a hotkey are not listed on your side of a container. (Stewie's Tweaks bHideHotkeyedItemsInContainers)" = "查看容器时，玩家的物品列表不显示已绑定快捷键的物品。 (Stewie's Tweaks bHideHotkeyedItemsInContainers)"
"Hide Hotkeyed Items in Barter" = "交易时隐藏已绑定快捷键的物品"
"Things on a hotkey are not offered when trading. (Stewie's Tweaks bHideHotkeyedItemsInBarter)" = "交易界面不出售已绑定快捷键的物品。 (Stewie's Tweaks bHideHotkeyedItemsInBarter)"
"Hide Hotkeyed Items in Repair" = "修理时隐藏已绑定快捷键的物品"
"Things on a hotkey are not offered as parts when repairing in the Pip-Boy. (Stewie's Tweaks bHideHotkeyedItemsInRepairLists)" = "在 Pip-Boy 中修理时，已绑定快捷键的物品不会列为修理材料。 (Stewie's Tweaks bHideHotkeyedItemsInRepairLists)"
"Map Zooms at the Pointer" = "地图以鼠标指针为中心缩放"
"The mouse wheel zooms the Pip-Boy's maps in and out about the place under the pointer, not the middle. (Stewie's Tweaks bBetterMapZoom)" = "滚动鼠标滚轮时，Pip-Boy 地图围绕指针所指位置缩放。 (Stewie's Tweaks bBetterMapZoom)"
"Console Homes" = "控制台位置书签"
"Console: sethome, home and delhome [name]; back undoes the last home or back. Kept until you quit. (Stewie's Tweaks bAddSetHomeCommand)" = "在控制台使用 sethome、home 和 delhome [name]。back 可撤销上一次 home 或 back 操作。退出游戏后清除位置书签。 (Stewie's Tweaks bAddSetHomeCommand)"
"Shift Screenshot Hides the HUD" = "按住 Shift 截图时隐藏界面"
"Holding Shift as you take a screenshot leaves the HUD, crosshair and messages out of the picture. (Stewie's Tweaks bShiftScreenshotHidesMenus)" = "按住 Shift 键截图时，不截入界面、准星和消息。 (Stewie's Tweaks bShiftScreenshotHidesMenus)"
"Console Lines Name Their Plugin" = "控制台输出显示所属插件"
"A line a script prints to the console starts with the name of the plugin it comes from, in brackets. (Stewie's Tweaks bModConsolePrintsIncludeName)" = "脚本输出到控制台的每行文字，开头会用方括号注明其所属插件的名称。 (Stewie's Tweaks bModConsolePrintsIncludeName)"
"Weapon Requirements Matter" = "装备武器需满足使用要求"
"A weapon cannot be equipped while your Strength or its skill is below what it asks. (Stewie's Tweaks bWeaponRequirementsMatter)" = "力量或对应技能低于武器要求时，无法装备该武器。 (Stewie's Tweaks bWeaponRequirementsMatter)"
"Console Shows Models" = "在控制台显示模型路径"
"Selecting something in the console also prints the path of its model; its cell's Editor ID and name are always shown. (Stewie's Tweaks bExtraConsoleDetails)" = "在控制台中选中对象时也会输出其模型路径。无论此项是否开启，始终显示对象所在区块的编辑器 ID 和名称。 (Stewie's Tweaks bExtraConsoleDetails)"
"Backward Pace" = "后退速度"
"How fast you move backwards, as a part of your usual pace; 100% changes nothing. (Stewie's Tweaks bMovementPenalties)" = "后退速度按常规移动速度的此百分比计算。100% 保持原速度。 (Stewie's Tweaks bMovementPenalties)"
"Sideways Pace" = "横移速度"
"How fast you move sideways, as a part of your usual pace; 100% changes nothing. Diagonals fall between. (Stewie's Tweaks bMovementPenalties)" = "横移速度按常规移动速度的此百分比计算。100% 保持原速度。斜向移动速度介于两者之间。 (Stewie's Tweaks bMovementPenalties)"
"Hacking: Symbols Do Nothing" = "破解时不响应单独的符号"
"Clicking a lone symbol while hacking does nothing and prints nothing. (Stewie's Tweaks bImprovedHacking)" = "破解时点击单个符号既无效果，也不会输出文字。 (Stewie's Tweaks bImprovedHacking)"
"Hacking: No Repeat Guesses" = "破解时禁止重复猜测"
"A word you have already tried cannot be tried again, so it costs no attempt. (Stewie's Tweaks bImprovedHacking)" = "已经试过的单词无法再试，因此不会消耗破解次数。 (Stewie's Tweaks bImprovedHacking)"
"Hacking: Dud When Attempts Full" = "尝试次数未用时移除错误词"
"A bracket pair found with all attempts left removes a dud instead of giving attempts back. (Stewie's Tweaks bImprovedHacking)" = "尝试次数尚未消耗时，找到成对的括号会移除一个错误单词，而非恢复次数。 (Stewie's Tweaks bImprovedHacking)"
"Hacking: Duds Spare Tried Words" = "保留破解中已试过的单词"
"Removing a dud leaves the words you have already tried, unless only they are left. (Stewie's Tweaks bImprovedHacking)" = "移除错误单词时保留已试过的单词，除非只剩这些单词。 (Stewie's Tweaks bImprovedHacking)"
"Run While Overencumbered" = "超重时允许奔跑"
"Carrying too much, you can still run and jump by spending Action Points; with none left you walk. (Stewie's Tweaks bOverencumberedTweak)" = "超重时仍可消耗行动点数奔跑和跳跃。点数耗尽后改为步行。 (Stewie's Tweaks bOverencumberedTweak)"
"Overencumbered Running AP" = "超重奔跑消耗的行动点数"
"Action Points running costs each second while carrying too much (with Run While Overencumbered). (Stewie's Tweaks bOverencumberedTweak)" = "开启「超重时允许奔跑」后，超重时每奔跑一秒消耗的行动点数。 (Stewie's Tweaks bOverencumberedTweak)"
"Overencumbered Jump AP" = "超重跳跃消耗的行动点数"
"Action Points a jump costs while carrying too much (with Run While Overencumbered). (Stewie's Tweaks bOverencumberedTweak)" = "开启「超重时允许奔跑」后，超重时每次跳跃消耗的行动点数。 (Stewie's Tweaks bOverencumberedTweak)"
"Enemy Blows Hit Where They Land" = "敌人近战伤害取决于命中部位"
"A melee or unarmed blow on you is multiplied by the body part it lands on (more on the head), as your own blows are. (Stewie's Tweaks bLocationalMeleeDamage)" = "和玩家的近战攻击一样，敌人用近战武器或徒手命中你时，也会按命中部位调整伤害，例如命中头部伤害更高。 (Stewie's Tweaks bLocationalMeleeDamage)"
"Disarming Needs Skill" = "解除地雷需要技能"
"Mine disarming fails more the lower your Explosives and Perception, and may set it off (less with Luck). (Stewie's Tweaks bDisarmRequiresSkill)" = "爆破技能和感知越低，解除地雷失败的可能性越高，也可能触发地雷。幸运越高，误触发的可能性越低。 (Stewie's Tweaks bDisarmRequiresSkill)"
"Disarm Chance Multiplier" = "解除地雷成功率倍率"
"Multiplies the chance to disarm a mine (Disarming Needs Skill); 1 as the formula gives it. (Stewie's Tweaks bDisarmRequiresSkill)" = "开启「解除地雷需要技能」后，解除地雷的成功率乘以此倍率。设为 1 时沿用公式结果。 (Stewie's Tweaks bDisarmRequiresSkill)"
"Set-Off Chance Multiplier" = "解除失败触发地雷的概率倍率"
"Multiplies the chance that a failed disarm sets the mine off (Disarming Needs Skill); 0 never. (Stewie's Tweaks bDisarmRequiresSkill)" = "开启「解除地雷需要技能」后，解除失败而触发地雷的概率乘以此倍率。设为 0 时失败不会触发地雷。 (Stewie's Tweaks bDisarmRequiresSkill)"
"Skills Capped by S.P.E.C.I.A.L." = "S.P.E.C.I.A.L. 限制技能上限"
"On leveling up a skill rises only to its base plus its attribute's share (and Luck's), up to the cap below. (Stewie's Tweaks bCapSkillsBySPECIAL)" = "升级时，技能只能提升至其基础上限加上相关属性和幸运的加成，且最多达到下方所设的上限。 (Stewie's Tweaks bCapSkillsBySPECIAL)"
"Skill Cap Base" = "技能基础上限"
"The part of every skill's cap before attributes (Skills Capped by S.P.E.C.I.A.L.). (Stewie's Tweaks bCapSkillsBySPECIAL)" = "开启「S.P.E.C.I.A.L. 限制技能上限」时，各项技能计入属性加成前的基础上限。 (Stewie's Tweaks bCapSkillsBySPECIAL)"
"Skill Cap per Attribute Point" = "每点相关属性提高的技能上限"
"What each point of the governing attribute adds to a skill's cap. (Stewie's Tweaks bCapSkillsBySPECIAL)" = "每点对应属性可使该技能的上限提高多少。 (Stewie's Tweaks bCapSkillsBySPECIAL)"
"Skill Cap per Luck Point" = "每点幸运提高的技能上限"
"What each point of Luck adds to every skill's cap. (Stewie's Tweaks bCapSkillsBySPECIAL)" = "每点幸运可使所有技能的上限提高多少。 (Stewie's Tweaks bCapSkillsBySPECIAL)"
"Skill Cap Most" = "技能上限最大值"
"No skill's cap goes above this (Skills Capped by S.P.E.C.I.A.L.). (Stewie's Tweaks bCapSkillsBySPECIAL)" = "开启「S.P.E.C.I.A.L. 限制技能上限」时，任何技能的上限都不会超过此值。 (Stewie's Tweaks bCapSkillsBySPECIAL)"
"Skill Cap Spares Tagged Skills" = "专精技能不受上限限制"
"Tagged skills are not capped by Skills Capped by S.P.E.C.I.A.L. (Stewie's Tweaks bCapSkillsBySPECIAL)" = "选择的专精技能不受「S.P.E.C.I.A.L. 限制技能上限」约束。 (Stewie's Tweaks bCapSkillsBySPECIAL)"
"Hold Breath Through a Scope" = "用瞄准镜时可屏息"
"Holding Shift while looking through a scope steadies it, costing Action Points while held; with none left the breath goes. (Stewie's Tweaks bScopeHoldBreath)" = "通过瞄准镜瞄准时，按住 Shift 键可屏息并稳住瞄准镜，持续消耗行动点数。点数耗尽便恢复呼吸。 (Stewie's Tweaks bScopeHoldBreath)"
"Held Breath Sway" = "屏息时的瞄准镜晃动"
"How much a scope still sways while the breath is held, as a part of its usual sway. (Stewie's Tweaks bScopeHoldBreath)" = "屏息后瞄准镜的晃动幅度，按平时幅度的百分比计。 (Stewie's Tweaks bScopeHoldBreath)"
"Held Breath AP" = "屏息消耗的行动点数"
"Action Points holding the breath costs each second (Hold Breath Through a Scope). (Stewie's Tweaks bScopeHoldBreath)" = "开启「用瞄准镜时可屏息」后，每屏息一秒消耗的行动点数。 (Stewie's Tweaks bScopeHoldBreath)"
"Wheel Zooms Scopes" = "滚轮调整瞄准镜倍率"
"The mouse wheel zooms a scope in (up) and out, half to double the usual, reset each time. (Stewie's Tweaks bAdjustableScopeZoom)" = "鼠标滚轮向上放大、向下缩小，范围为常规倍率的一半至两倍。每次使用瞄准镜时重置。 (Stewie's Tweaks bAdjustableScopeZoom)"
"Mouse Wheel Changes Weapon" = "滚动鼠标滚轮切换武器"
"In first person, rolling the mouse wheel takes out the next (up) or previous weapon on your hotkeys. (Stewie's Tweaks bMousewheelScrollsWeaponHotkeys)" = "在第一人称视角中，向上或向下滚动鼠标滚轮会取出快捷键上绑定的下一把或上一把武器。 (Stewie's Tweaks bMousewheelScrollsWeaponHotkeys)"
"D-Pad Changes Weapon" = "用手柄方向键切换武器"
"D-pad right takes out the next hotkeyed weapon, left the one before, not Ammo Swap and hotkey 4. (Stewie's Tweaks bWeaponCycleUpDownHotkeys)" = "手柄方向键右键取出已绑定快捷键的下一把武器，左键取出上一把。这两个方向键不再用于「切换弹药」和快捷键 4。 (Stewie's Tweaks bWeaponCycleUpDownHotkeys)"
"Keyboard and Mouse With a Controller" = "使用手柄时键鼠仍可操作"
"With a controller, keyboard and mouse still work outside menus. (Stewie's Tweaks bAllowKeyboardAndMouseWithControllerConnected)" = "使用手柄时，在菜单之外仍可使用键盘和鼠标。 (Stewie's Tweaks bAllowKeyboardAndMouseWithControllerConnected)"
"Double-Tap Reload Changes Ammo" = "快速双按装填键切换弹药"
"Tapping Reload twice quickly swaps the ammo type; one tap reloads after a third of a second. (Stewie's Tweaks bDoubleTapReloadToChangeAmmoType)" = "快速按两次装填键可切换弹药类型。按一次时，三分之一秒后开始装填。 (Stewie's Tweaks bDoubleTapReloadToChangeAmmoType)"
"Improved Weather" = "短途快速旅行保留天气"
"A short fast travel keeps the weather instead of rolling a new one for the trip. (Stewie's Tweaks bImprovedWeather)" = "短途快速旅行会保留原来的天气，无需重新随机生成天气。 (Stewie's Tweaks bImprovedWeather)"
"V.A.T.S. Stops Following the Dead" = "V.A.T.S. 镜头停止追踪死者"
"A kill camera stops turning after its target once it is dead, holding where it last saw it alive. (Stewie's Tweaks bVATSStopFollowingDeadTargets)" = "目标死亡后，击杀镜头不再转动追踪，保持对准目标生前最后所在的位置。 (Stewie's Tweaks bVATSStopFollowingDeadTargets)"
"Night Vision Toggle" = "切换瞄准镜夜视"
"With a night-vision scope up, the light's key (holding Tab, or its own key) toggles its night vision. (Stewie's Tweaks bAddNightVisionToggle)" = "使用夜视瞄准镜时，可用照明键（长按 Tab 或专用按键）开启或关闭夜视。 (Stewie's Tweaks bAddNightVisionToggle)"
"Night Vision Toggle: Off Until Switched On" = "夜视默认关闭"
"A night-vision scope gives no night vision until you switch it on. (bDisableVisionByDefault)" = "夜视瞄准镜需手动开启才提供夜视效果。 (bDisableVisionByDefault)"
"Night Vision Toggle: By Day Too" = "白天也可用夜视"
"A night-vision scope gives its night vision by day as well. (bAllowNightVisionDuringDay)" = "夜视瞄准镜在白天也能提供夜视效果。 (bAllowNightVisionDuringDay)"
"Kill Camera Outside V.A.T.S." = "V.A.T.S. 外也播放击杀镜头"
"Kills outside V.A.T.S. get kill cameras too (Kill camera rules), 20 s apart. (Ours; see Stewie's Tweaks bUseHitLocationInCinematicKillcams)" = "在 V.A.T.S. 之外击杀目标时，也依照「击杀镜头」设置播放镜头，间隔至少 20 秒。 (Ours; see Stewie's Tweaks bUseHitLocationInCinematicKillcams)"
"Kill Camera Focuses on the Hit Location" = "击杀镜头对准命中部位"
"A kill camera looks at the part your shot struck: the head, the chest, the legs. (Stewie's Tweaks bUseHitLocationInCinematicKillcams)" = "击杀镜头对准射击命中的部位，例如头部、胸部或腿部。 (Stewie's Tweaks bUseHitLocationInCinematicKillcams)"
"Improved Weather: Short Trip" = "保留天气的快速旅行距离"
"How far a fast travel may go and keep the weather (about 4,100 units to a cell). (Stewie's Tweaks fFastTravelWeatherChangeDistanceThreshold)" = "快速旅行不改变天气的最远距离（每个地图区块约 4,100 单位）。 (Stewie's Tweaks fFastTravelWeatherChangeDistanceThreshold)"
"Fade Pips by Distance" = "罗盘角色标记随距离淡出"
"Compass marks fade with distance, over the range people and creatures could notice you. (Stewie's Tweaks bCompassNPCDistanceBasedAlpha)" = "在人物和生物可以察觉到玩家的距离范围内，距离越远，罗盘标记越淡。 (Stewie's Tweaks bCompassNPCDistanceBasedAlpha)"
"Fade Places by Distance" = "罗盘地点标记随距离淡出"
"Places on the compass grow fainter the further away they are, over the distance they show at. (Stewie's Tweaks bCompassLocationDistanceBasedAlpha)" = "在地点能显示于罗盘的范围内，距离越远，标记越淡。 (Stewie's Tweaks bCompassLocationDistanceBasedAlpha)"
"Health Bars Count Buffs" = "生命值条计入增益"
"Target health bars count Health raised by chems and effects: what a buffed enemy can take. (Stewie's Tweaks bEnemyHealthbarShowBuffedHP)" = "目标的生命值条会计入药物和其他效果增加的生命值，反映增益后的实际承伤能力。 (Stewie's Tweaks bEnemyHealthbarShowBuffedHP)"
"Recently Dead on the Compass (s)" = "罗盘保留刚死亡的角色标记（秒）"
"For how many seconds, up to 120, someone killed nearby stays on the compass, until you look at them; 0 none. (Stewie's Tweaks bRecentlyDeadNPCIndicator)" = "在附近被杀的角色会在罗盘上保留此秒数，最长 120 秒。看向该角色会提前移除标记。设为 0 时不保留。 (Stewie's Tweaks bRecentlyDeadNPCIndicator)"
"Armour Rustle From the Body" = "护甲声从角色身上发出"
"In third person your armour and clothing are heard from your character, not at the camera. (Stewie's Tweaks bArmorSoundsPlayIn3D)" = "第三人称视角下，护甲和衣物的摩擦声从玩家角色身上发出。 (Stewie's Tweaks bArmorSoundsPlayIn3D)"
"Mine Blasts Are Heard" = "地雷爆炸会引起警觉"
"A mine going off alerts the people near who would fight whoever laid it, or whoever set it off. (Stewie's Tweaks bNPCsDetectMineExplosions)" = "地雷爆炸会惊动附近可能与布雷者或引爆者交战的人。 (Stewie's Tweaks bNPCsDetectMineExplosions)"
"Explosions Leave Items Be" = "爆炸不移动物品"
"Explosions do not throw about things you can pick up, so loot stays where it lies. (Stewie's Tweaks bExplosionsDontPushTakeableItems)" = "爆炸不会把可拾取的物品炸得到处都是，战利品会留在原处。 (Stewie's Tweaks bExplosionsDontPushTakeableItems)"
"Held Items Weigh" = "抓持物品计入负重"
"An item you are holding up with the grab counts toward what you carry, so it can leave you overencumbered. (Stewie's Tweaks bEncumbranceIncludesGrabbedItems)" = "用「抓取物体」举起的物品计入负重，因此可能使玩家超重。 (Stewie's Tweaks bEncumbranceIncludesGrabbedItems)"
"Usable Ammo First" = "可用弹药优先显示"
"In the Pip-Boy's ammo list, ammo that a weapon you carry can fire comes first. (Stewie's Tweaks bSortEquipableAmmo)" = "Pip-Boy 弹药列表优先显示身上所带武器能够发射的弹药。 (Stewie's Tweaks bSortEquipableAmmo)"
"Better Free Camera" = "增强自由镜头控制"
"Free camera (tfc): Space rises, Ctrl sinks, Q flies on (S stops), Z and C turn; the wheel sets speed. (Stewie's Tweaks bBetterFlycam)" = "自由镜头（tfc）中，空格键上升，Ctrl 下降，Q 持续飞行（S 停止），Z 和 C 转动镜头。滚轮调整速度。 (Stewie's Tweaks bBetterFlycam)"
"New Places Red on the Map" = "地图用红色标记新发现的地点"
"Places you found since starting NVForever are drawn red on the world map. (Stewie's Tweaks bColorRecentlyAddedMapMarkers)" = "本次启动 NVForever 后发现的地点在世界地图上以红色标出。 (Stewie's Tweaks bColorRecentlyAddedMapMarkers)"
"Quest Marker Height" = "显示任务标记的高度差"
"A quest marker on the compass more than a storey above or below you has a short bar over or under it. (Stewie's Tweaks bCompassQuestHeightIndicator)" = "罗盘上的任务标记若高于或低于玩家超过一层楼，会在标记上方或下方显示短线。 (Stewie's Tweaks bCompassQuestHeightIndicator)"
"Your Marker's Height" = "显示自设标记的高度差"
"Your own map marker on the compass, more than a storey above or below you, has a short bar over or under it. (Stewie's Tweaks bPlacedMarkerHeightIndicator)" = "罗盘上的自设地图标记若高于或低于玩家超过一层楼，会在标记上方或下方显示短线。 (Stewie's Tweaks bPlacedMarkerHeightIndicator)"
"Place Name on the HUD" = "在界面上显示地点名"
"The name of the map marker the player faces is shown over the compass. (Stewie's Tweaks bHUDMarkerNameIndicator)" = "罗盘上方显示玩家面向的地图标记的名称。 (Stewie's Tweaks bHUDMarkerNameIndicator)"
"Region Name on the HUD" = "在界面上显示区域名"
"Outdoors, the name of the region you stand in (its map name, as the Pip-Boy's map gives it) is shown over the compass. (Stewie's Tweaks bHUDShowRegionNames)" = "在户外时，罗盘上方显示玩家所在区域的名称，与 Pip-Boy 地图上的名称一致。 (Stewie's Tweaks bHUDShowRegionNames)"
"Move While the Pip-Boy Comes Up" = "抬起 Pip-Boy 时仍可移动"
"You can keep walking and looking about while the Pip-Boy rises to your eyes; the world stops once it is up. (Stewie's Tweaks bMoveDuringOpenPipboyAnim)" = "将 Pip-Boy 抬到眼前的过程中，仍可行走和环顾。设备完全打开后，游戏世界暂停。 (Stewie's Tweaks bMoveDuringOpenPipboyAnim)"
"World Borders: Warning Only" = "世界边界只提示"
"At a world border (a plugin's border region) you are warned but not stopped. (Stewie's Tweaks bDisableRegionBordersKeepMessage)" = "抵达插件定义的世界边界区域时，只显示警告，仍可继续前进。 (Stewie's Tweaks bDisableRegionBordersKeepMessage)"
"Place Name: Widest Angle" = "地点名显示的最宽角度"
"How far off straight ahead, in degrees, a place's name is still shown. (Stewie's Tweaks bHUDMarkerNameIndicator)" = "地点偏离正前方不超过此角度时，仍显示其名称，以度为单位。 (Stewie's Tweaks bHUDMarkerNameIndicator)"
"Place Name: Only Places Found" = "地点名只显示已发现地点"
"Places the player has not found are not named. (Stewie's Tweaks bHUDMarkerNameIndicator)" = "不显示玩家尚未发现的地点的名称。 (Stewie's Tweaks bHUDMarkerNameIndicator)"
"Place Name: Distance" = "地点名旁显示距离"
"Whether the place's name comes with how far it is, and in what. (Stewie's Tweaks bHUDMarkerNameIndicator)" = "选择是否在地点名称旁显示距离，以及使用什么单位。 (Stewie's Tweaks bHUDMarkerNameIndicator)"
"Hide HUD Key: Health and Compass" = "隐藏 HUD键：生命值和罗盘"
