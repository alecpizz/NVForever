"Delete them now asks the server to delete every report this PC sent (within 7 days) and drops unsent ones; later reports get a new ID." = "选择「立即删除」会清除未发送的报告，并请求服务器在 7 天内删除本机已发送的所有报告。以后的报告会使用新 ID。"
