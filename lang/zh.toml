"Repeat Activate Takes Only" = "重复交互仅拿取物品"
"Repeat Activate (Controls page, unbound at first), held, takes again and again; off, activates anything. (Stewie's Tweaks iRepeatActivateKey)" = "「控制」页的「重复交互」默认没有绑定按键。开启此项后，按住该键只会连续拿取物品。关闭后可与任何对象连续交互。 (Stewie's Tweaks iRepeatActivateKey)"
"Fine Weapon Models for Everyone" = "所有角色使用精细武器模型"
"People hold the detailed first-person models of their weapons; weapons drawn after the change. (Stewie's Tweaks bForceHiResWeaponModels)" = "角色手中的武器使用精细的第一人称模型。从下次举起武器时生效。 (Stewie's Tweaks bForceHiResWeaponModels)"
"Reload Swaps Spent Ammo" = "当前弹药耗尽时换用其他弹药"
"Reloading when none of the ammo in use is left changes to another kind you carry. (Stewie's Tweaks bReloadingWithNoAmmoSwapsAmmoTypes)" = "所用弹药耗尽后重新装填，会换用携带的另一种适用弹药。 (Stewie's Tweaks bReloadingWithNoAmmoSwapsAmmoTypes)"
"Objectives on Arrival" = "到达新地点时重显任务目标"
"Going through a door to a new place shows your active quest's open objectives again. (Stewie's Tweaks bShowQuestObjectivesOnCellChange)" = "穿门抵达新地点时，再次显示当前任务尚未完成的目标。 (Stewie's Tweaks bShowQuestObjectivesOnCellChange)"
"Objectives on Arrival Gap (s)" = "重显任务目标的最短间隔（秒）"
"The least time, up to 300 seconds, between two showings of Objectives on Arrival. (Stewie's Tweaks bShowQuestObjectivesOnCellChange)" = "「到达新地点时重显任务目标」两次显示之间至少相隔多少秒，最长可设为 300 秒。 (Stewie's Tweaks bShowQuestObjectivesOnCellChange)"
