"The price multiplier of aid items the player buys, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家购买补给品的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
"Barter by Kind: Buying Ammo" = "分类定价：购买弹药"
"The price multiplier of ammo items the player buys, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家购买弹药的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
"Barter by Kind: Buying Misc" = "分类定价：购买杂项"
"The price multiplier of misc items the player buys, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家购买杂项物品的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
