"The frame times of the last 5 seconds as a line under the frame rate, the newest at the right, a faint line at 60 Hz (16.7 ms)." = "在帧率下方绘制最近 5 秒的帧耗时曲线，最新数据在右侧。淡色参考线表示 60 Hz（16.7 毫秒）。"
"Counter: frame split" = "计数器：各阶段耗时"
