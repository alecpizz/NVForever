"Prices in a barter are multiplied by the kind of item and by whether the player sells or buys it. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "交易价格按物品类别乘以对应倍率，买入和卖出分别计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
