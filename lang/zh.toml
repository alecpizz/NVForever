"The game goes on meanwhile. Hide keeps the download running; its choice on the Upscaler row shows this again. Loading a save, going to the main menu or quitting stops it." = "下载期间可以继续游戏。选择「隐藏」后下载会继续，在「超分辨率」一栏选择下载项可重新打开此窗口。读取存档、返回主菜单或退出游戏会停止下载。"
"Hide" = "隐藏"
"Cancel download" = "取消下载"
