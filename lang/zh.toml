"What merchants pay or ask for things worth nothing (spent casings); 0 changes nothing. (Stewie's Tweaks bNoFreeBarterItems)" = "商人收购或出售价值为零的物品时采用的价格，例如用过的弹壳。设为 0 时保持默认。 (Stewie's Tweaks bNoFreeBarterItems)"
"Skip Easy Locks" = "跳过简单撬锁"
"A lock well under the player's Lockpick opens at once (with its experience); use it again to go through. (Stewie's Tweaks bSkipVeryEasyLocksAtMaxSkill)" = "若玩家的开锁技能远高于锁的难度，立即开锁并获得经验。再次互动即可通过。 (Stewie's Tweaks bSkipVeryEasyLocksAtMaxSkill)"
"Skip Easy Locks: Margin" = "跳过简单撬锁：超出点数"
"How far over the lock Lockpick must be to skip the game (0 to 50). (Stewie's Tweaks bSkipVeryEasyLocksAtMaxSkill, iThreshold)" = "要跳过撬锁小游戏，开锁技能需比锁的难度高出多少点，范围为 0 至 50。 (Stewie's Tweaks bSkipVeryEasyLocksAtMaxSkill, iThreshold)"
"Pick Up Disarmed Mines" = "自动拾取已解除的地雷"
"A mine the player disarms goes straight into the inventory. (Stewie's Tweaks bDisarmingMinesPicksThemUp)" = "玩家解除地雷后，地雷直接收入物品栏。 (Stewie's Tweaks bDisarmingMinesPicksThemUp)"
"NPC Weapons Hit Whole" = "非玩家角色的武器伤害不受磨损影响"
