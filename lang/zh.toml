"Doors on the Compass: Reach Inside" = "室内门的罗盘显示距离"
"How far away a door inside still shows, in game units (70 a metre). (Stewie's Tweaks bShowDoorsOnCompass)" = "室内的门在多远以内会显示在罗盘上，以游戏单位计。70 游戏单位约为 1 米。 (Stewie's Tweaks bShowDoorsOnCompass)"
"Doors on the Compass: Fade by Distance" = "门的罗盘标记随距离淡出"
"A door's mark is fainter the further away it is. (Stewie's Tweaks bShowDoorsOnCompass)" = "门离玩家越远，其罗盘标记越淡。 (Stewie's Tweaks bShowDoorsOnCompass)"
