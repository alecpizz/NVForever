"How edges are smoothed: multisampling 2x, 4x or 8x (dearer at each step) or FXAA, SMAA or TAA afterwards. Shown while no upscaler is chosen." = "设置抗锯齿方式。可用 2x、4x 或 8x 多重采样，倍率越高开销越大，也可在渲染后用 FXAA、SMAA 或 TAA 处理。未启用超分辨率时显示此项。"
"Latency reduction" = "降低输入延迟"
"The graphics driver keeps the game from preparing frames ahead (AMD Anti-Lag, NVIDIA low latency), meant to show what you do sooner. Not in the original." = "显卡驱动会限制游戏提前准备帧，尽早显示输入后的画面。对应 AMD Anti-Lag 或 NVIDIA 低延迟模式。此功能为 NVForever 新增。"

