"No answer from GitHub: check the connection, then try again." = "GitHub 无响应，请检查网络连接后重试。"
"GitHub answered with an error (HTTP {status})." = "GitHub 返回错误（HTTP {status}）。"
"What GitHub sent was not NVIDIA's expected archive; nothing was kept." = "GitHub 返回的文件与预期的 NVIDIA 压缩包不符，未保存任何文件。"
"{name} did not match the tested release; nothing was kept." = "{name} 与已验证版本不符，未保存任何文件。"
"{name} failed its signature check; nothing was kept." = "{name} 未通过签名验证，未保存任何文件。"
"The dlss folder already holds {name}, which was left as it is: remove it, or copy the files by hand." = "dlss 文件夹中已存在 {name}，原文件保持不变。请移除该文件，或手动复制所需文件。"
"The files could not be written to the dlss folder." = "无法将文件写入 dlss 文件夹。"
"The download stopped on an internal error; the log says more." = "下载因内部错误而中止，详情见日志。"
"Details: {why}" = "详情：{why}"
