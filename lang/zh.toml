"On: while a louder sound plays near you (machines, voices, shots, creatures), the noise you make is not heard. Not in the original." = "开启时，如果附近的机器、人声、枪声或生物等声音更响，你发出的噪声会被掩盖。此功能为 NVForever 新增。"
"How far the world slows while you choose targets in Classic: 100% stops it, 50% runs at half speed, 0% not at all. Enemies attack at anything less than a stop." = "设置在经典模式中选择目标时的时间减速幅度。100% 为完全暂停，50% 为半速，0% 为正常速度。只要时间没有暂停，敌人仍可攻击。"
