"Sneak Criticals Head Only" = "潜行攻击仅命中头部时暴击"
"Sneak attacks are criticals only on the head. (Stewie's Tweaks bSneakCriticalsHeadshotsOnly)" = "潜行攻击只有命中头部时才会暴击。 (Stewie's Tweaks bSneakCriticalsHeadshotsOnly)"
