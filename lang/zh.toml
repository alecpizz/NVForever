"Counter: GPU use" = "计数器：GPU 使用率"
"Counter: GPU memory" = "计数器：显存"
"The graphics memory the game holds against the driver's budget, read every 2 seconds. Marked ! while near it the game keeps fewer unused assets." = "每 2 秒读取一次游戏占用的显存和驱动给出的显存预算。接近预算时会标记 !，游戏会少保留闲置资源。"
"Counter: RAM" = "计数器：内存"
"The game's RAM and the machine's RAM in use. Marked ! while under a tenth is free and the game keeps fewer unused assets. Windows only." = "显示游戏和整机的内存用量。可用内存不足 10% 时会标记 !，游戏会少保留闲置资源。仅适用于 Windows。"
"Counter: loaded" = "计数器：已加载对象"
"What the game holds now: the cells in the physics world, placed objects with a model, actors with a skeleton and engine entities." = "显示当前已加载的物理区块、带模型的场景物体、带骨骼的角色及引擎实体的数量。"
"Counter: upscaling" = "计数器：超分辨率"
"Desert haze (experimental)" = "沙尘薄雾（实验性）"
"On: a thin dust haze thickens with distance and toward the ground, warmer toward the sun, as far as the weather's fog allows. Not in the original." = "开启时，沙尘薄雾在远处和近地面处更浓，朝向太阳时色调更暖，浓度受当前天气的雾限制。此功能为 NVForever 新增。"
"Enhanced water effects" = "增强水体效果"
"Sunlight shifts across shallow beds. Deeper water looks murkier. Selected rivers flow, shorelines lap, and shots and blasts disturb the surface." = "阳光在浅水水底形成流动的光纹，深水显得更浑浊。部分河流向下游流动，岸边有波浪拍打。枪击和爆炸会扰动水面。"
"Terrain height blending" = "按高度混合地形纹理"
"On: where ground textures meet, the new one shows through its brighter stones and clumps first instead of an even fade. Fully painted ground is unchanged." = "开启时，地面纹理交界处会先显现新纹理中较亮的石块和土团，过渡更加自然。纹理完整覆盖的区域保持原样。"
"Terrain anti-tiling" = "减少地形纹理重复"
"On: ground textures stop repeating as a visible grid, for some GPU time. Off: each repeats every 256 units, as in the original." = "开启时，消除地面纹理的明显网格状重复，会增加 GPU 开销。关闭后沿用原版，每隔 256 单位重复一次。"
"On: draw triangle edges over the loaded landscape to inspect its shape. Changes immediately. Distant terrain is not outlined." = "开启时，用三角网格勾勒已加载的地表，便于检查地形。立即生效，远处地形保持原样。"
