"Download DLSS" = "下载 DLSS"
"NVForever fetches eight files for DLSS upscaling and frame generation from NVIDIA's Streamline 2.14.16 release on GitHub: sl.interposer.dll, sl.common.dll, sl.dlss.dll, sl.dlss_g.dll, sl.reflex.dll and sl.pcl.dll, under Streamline's MIT licence, and nvngx_dlss.dll and nvngx_dlssg.dll, under NVIDIA's RTX SDKs licence below. Nothing is downloaded unless you accept it." = "NVForever 会从 GitHub 上 NVIDIA 发布的 Streamline 2.14.16 版本下载八个文件，用于 DLSS 超分辨率和帧生成。其中 sl.interposer.dll、sl.common.dll、sl.dlss.dll、sl.dlss_g.dll、sl.reflex.dll 和 sl.pcl.dll 适用 Streamline 的 MIT 许可证，nvngx_dlss.dll 和 nvngx_dlssg.dll 则适用下方的 NVIDIA RTX SDK 许可证。同意后才会开始下载。"
"NVIDIA's RTX SDKs licence for nvngx_dlss.dll and nvngx_dlssg.dll" = "适用于 nvngx_dlss.dll 和 nvngx_dlssg.dll 的 NVIDIA RTX SDK 许可证"
"Lines {first} to {last} of {total}. PgUp, PgDn, the arrow keys or the mouse wheel scroll." = "共 {total} 行，当前显示第 {first} 至 {last} 行。可用 PgUp、PgDn、方向键或鼠标滚轮滚动。"
"I accept starts the download; the game goes on meanwhile." = "选择「我同意」即可开始下载，期间可以继续游戏。"
