"Radio Volume Up" = "调高电台音量"
"Radio Volume Down" = "调低电台音量"
"Last Weapon" = "切回上一把武器"
"Smooth Camera" = "平滑镜头"
"Repeat Activate" = "重复交互"
"Second Iron Sights" = "副机械瞄具"
"Place Marker Here" = "在此放置标记"
"Hide HUD" = "隐藏 HUD"
"Skip Radio Song" = "跳过电台歌曲"
"Screenshot" = "截图"

# Tweaks setting labels and notes, in registration order.
"Location Discovered Sound" = "发现地点音效"
"The sound a newly discovered place plays: the game's own, or another of its interface sounds. (Stewie's Tweaks bCustomLocationDiscoveredSound)" = "发现新地点时播放游戏原有的提示音，或选用游戏中的其他界面音效。 (Stewie's Tweaks bCustomLocationDiscoveredSound)"
"Level-Up Sound A: Every N Levels" = "升级音效 A 的播放间隔"
"Every this many levels the level-up plays Sound A instead of its own; 0 never. (Stewie's Tweaks bAlternateLevelupSounds, iLevelA)" = "每升这么多级，便以音效 A 取代原有的升级音效。设为 0 时从不播放音效 A。 (Stewie's Tweaks bAlternateLevelupSounds, iLevelA)"
"Level-Up Sound A" = "升级音效 A"
"The sound for those levels. (Stewie's Tweaks bAlternateLevelupSounds, sSoundA)" = "在符合上述间隔的等级播放的音效。 (Stewie's Tweaks bAlternateLevelupSounds, sSoundA)"
"Level-Up Sound B: Every N Levels" = "升级音效 B 的播放间隔"
"Sound B every this many levels; where both fall on one level, the larger wins. 0 never. (Stewie's Tweaks bAlternateLevelupSounds, iLevelB)" = "每升这么多级播放音效 B；两者落在同一级时，较大者优先。0 为从不。 (Stewie's Tweaks bAlternateLevelupSounds, iLevelB)"
"Level-Up Sound B" = "升级音效 B"
"The sound for those levels. (Stewie's Tweaks bAlternateLevelupSounds, sSoundB)" = "在符合上述间隔的等级播放的音效。 (Stewie's Tweaks bAlternateLevelupSounds, sSoundB)"
"Experience Earned" = "经验获取倍率"
"Every experience gain is multiplied by this, after the perks; x1.0 changes nothing. (Stewie's Tweaks bReduceXP)" = "计算专长加成后，用此倍率调整每次获得的经验。x1.0 保持原值。 (Stewie's Tweaks bReduceXP)"
"Quiet Experience" = "隐藏经验提示"
"Experience gains do not bring up the XP meter or its sound; levelling up still does. (Stewie's Tweaks bNoXPMessages)" = "获得经验时不显示经验条，也不播放提示音。升级时仍有提示。 (Stewie's Tweaks bNoXPMessages)"
"Quiet Karma" = "隐藏道德值提示"
"Karma changes show no corner message and play no sound. (Stewie's Tweaks bNoKarmaMessages)" = "道德值变化时不在屏幕角落显示消息，也不播放提示音。 (Stewie's Tweaks bNoKarmaMessages)"
"No Quest Failed Banner" = "隐藏任务失败横幅"
"A failed quest puts up no banner; the Pip-Boy still lists it. (Stewie's Tweaks bNoQuestFailedPopup)" = "任务失败时不显示横幅。Pip-Boy 中仍可查看该任务。 (Stewie's Tweaks bNoQuestFailedPopup)"
"No Location Banner" = "隐藏地点发现横幅"
"Discovering a place puts up no banner; it is still marked on the map. (Stewie's Tweaks bNoLocationPopup)" = "发现新地点时不显示横幅。地图上仍会标记该地点。 (Stewie's Tweaks bNoLocationPopup)"
"No Objective List" = "隐藏任务目标列表"
"New and completed quest objectives are not listed on the HUD. (Stewie's Tweaks bRemoveQuestObjectiveAddedText)" = "界面上不再列出新增和已完成的任务目标。 (Stewie's Tweaks bRemoveQuestObjectiveAddedText)"
"No Fast Travel" = "禁用快速旅行"
"Fast travel is always refused. (Stewie's Tweaks bDisableFastTravel)" = "任何情况下都无法快速旅行。 (Stewie's Tweaks bDisableFastTravel)"
"Fast Travel in the Air" = "允许在空中快速旅行"
"Being in the air does not stop fast travel. (Stewie's Tweaks bMidairFastTravel)" = "角色在空中时仍可快速旅行。 (Stewie's Tweaks bMidairFastTravel)"
"Fast Travel Near Enemies" = "允许在敌人附近快速旅行"
"Enemies nearby do not stop fast travel. (Stewie's Tweaks bFastTravelWithEnemiesNearby)" = "附近有敌人时仍可快速旅行。 (Stewie's Tweaks bFastTravelWithEnemiesNearby)"
"Fast Travel Encumbered" = "允许超重时快速旅行"
"Carrying too much does not stop fast travel, as with Long Haul. (Stewie's Tweaks bFastTravelOverencumbered)" = "携带物品超重时仍可快速旅行，效果与「长途负重」专长相同。 (Stewie's Tweaks bFastTravelOverencumbered)"
"No Red Crosshair" = "准星不变红"
"The crosshair keeps its colour over hostile actors. (Stewie's Tweaks bNoRedCrosshairOnEnemies)" = "准星指向敌对角色时保持原有颜色。 (Stewie's Tweaks bNoRedCrosshairOnEnemies)"
"No Enemies on the Compass" = "罗盘隐藏敌人"
"Hostile actors are left off the compass. (Stewie's Tweaks bHideEnemyMarkers)" = "罗盘上不再标出敌对角色。 (Stewie's Tweaks bHideEnemyMarkers)"
"No Sneak Label" = "隐藏潜行状态提示"
"Sneaking shows no Hidden / Detected label on the HUD. (Stewie's Tweaks bRemoveSneakLabel)" = "潜行时，界面上不显示「未被发现」或「已被发现」。 (Stewie's Tweaks bRemoveSneakLabel)"
"Quiet Reputation" = "隐藏声望提示"
"Reputation changes put up no box and play no sound; the Pip-Boy still shows them. (Stewie's Tweaks bNoReputationMessages)" = "声望变化时不弹窗，也不播放提示音。Pip-Boy 上仍会显示变化。 (Stewie's Tweaks bNoReputationMessages)"
"No Battle Music" = "禁用战斗音乐"
"Fights do not switch the music to battle tracks. (Stewie's Tweaks bDisableCombatMusic)" = "战斗时音乐不会切换到战斗曲目。 (Stewie's Tweaks bDisableCombatMusic)"
"No Loading Tips" = "隐藏加载提示"
"Loading screens show their picture without the tip. (Stewie's Tweaks bDisableLoadingScreenTips)" = "加载画面只显示图片，不显示提示。 (Stewie's Tweaks bDisableLoadingScreenTips)"
"No Explosion Blur" = "禁用爆炸模糊"
"A blast close by does not blur the screen. (Stewie's Tweaks bDisableExplosionInFaceIMOD)" = "附近发生爆炸时，画面不会变得模糊。 (Stewie's Tweaks bDisableExplosionInFaceIMOD)"
"No Chem Wore-Off Effect" = "禁用药效消退特效"
"A chem wearing off plays no screen effect. (Stewie's Tweaks bRemoveChemWarnOffIMOD)" = "药效消退时不显示屏幕特效。 (Stewie's Tweaks bRemoveChemWarnOffIMOD)"
"Skip Kill Camera" = "跳过击杀镜头"
"A right click ends a kill camera at once. (Stewie's Tweaks bVatsExitKey)" = "单击鼠标右键立即结束击杀镜头。 (Stewie's Tweaks bVatsExitKey)"
"Perks First When No Points" = "无技能点时先选专长"
"A level-up with no skill points to spend opens on the perks. (Stewie's Tweaks bSkipSkillMenuIfNoPointsToAssign)" = "升级时若没有可分配的技能点，直接打开专长页。 (Stewie's Tweaks bSkipSkillMenuIfNoPointsToAssign)"
"No Message for Spent Books" = "隐藏技能已达上限的提示"
"A skill book that gives no points (the skill at its top) shows no message. (Stewie's Tweaks bNoSkillMessageIfIncreaseIsZero)" = "若对应技能已达上限，技能书无法提供点数，也不显示提示。 (Stewie's Tweaks bNoSkillMessageIfIncreaseIsZero)"
"Recipe Categories in Capitals" = "制作分类使用大写"
"The crafting menu's categories are shown in capitals. (Stewie's Tweaks bCapitalizeRecipeCategories)" = "制作菜单的分类名称以大写字母显示。 (Stewie's Tweaks bCapitalizeRecipeCategories)"
"Rounds per Shot" = "显示每次射击耗弹量"
"A weapon that uses more than one round a shot says how many beside its ammo in the Pip-Boy. (Stewie's Tweaks bShowWeaponAmmoUseInMenus)" = "若武器一次射击消耗多发弹药，Pip-Boy 会在弹药旁显示所需发数。 (Stewie's Tweaks bShowWeaponAmmoUseInMenus)"
"Skill Book Effects" = "显示技能书效果"
"A skill book says which skill it raises and by how much in the Pip-Boy. (Stewie's Tweaks bShowBookEffects)" = "在 Pip-Boy 中查看技能书可提升哪一项技能及其点数。 (Stewie's Tweaks bShowBookEffects)"
"Unassign Hotkeys" = "取消快捷键分配"
"Assigning an item to the hotkey it already has takes it off. (Stewie's Tweaks bDeselectHotkeys)" = "把物品再次分配给当前已绑定的快捷键，即可取消该绑定。 (Stewie's Tweaks bDeselectHotkeys)"
"Map Remembers Its Place" = "记住地图位置"
"The Pip-Boy maps open where they were left. (Stewie's Tweaks bMapRemembersPosition)" = "Pip-Boy 中的地图会在上次离开的位置打开。 (Stewie's Tweaks bMapRemembersPosition)"
"Number Keys on Terminals" = "终端数字键"
"1 to 9 and 0 choose a terminal's rows. (Stewie's Tweaks bNumberedComputerHotkeys)" = "按 1 至 9 或 0 选择终端中的对应行。 (Stewie's Tweaks bNumberedComputerHotkeys)"
"Faster Hacking Exit" = "缩短破解后的等待"
"A successful hack opens the terminal after half a second. (Stewie's Tweaks bFasterHackingTransition)" = "破解成功半秒后便打开终端。 (Stewie's Tweaks bFasterHackingTransition)"
"Music While Talking" = "交谈时的背景音乐音量"
"The music's volume in a conversation, as a part of its own; 100% changes nothing. (Stewie's Tweaks bScaleMusicVolumeDuringDialogue)" = "交谈时，背景音乐按原音量的此百分比播放。100% 保持原音量。 (Stewie's Tweaks bScaleMusicVolumeDuringDialogue)"
"Radio While Talking" = "交谈时的电台音量"
"The radio's volume in a conversation, as a part of its own; 100% changes nothing. (Stewie's Tweaks bScaleRadioSongVolumeDuringDialogue)" = "交谈时，电台按原音量的此百分比播放。100% 保持原音量。 (Stewie's Tweaks bScaleRadioSongVolumeDuringDialogue)"
"Console Clicks Skip the Player" = "控制台点击跳过玩家"
"Clicking in the console never selects the player. (Stewie's Tweaks bNonSelectablePlayerInConsole)" = "在控制台中点击时，永远不会选中玩家角色。 (Stewie's Tweaks bNonSelectablePlayerInConsole)"
"Holster in Real Time" = "收起武器按真实时间计时"
"Holding Ready Item to holster counts real time, so slowed time does not lengthen it. (Stewie's Tweaks bPipboyLightAndHolsteringIgnoreTimescale)" = "按住「举起／换弹」收起武器时按真实时间计时，游戏时间变慢也不会延长等待。 (Stewie's Tweaks bPipboyLightAndHolsteringIgnoreTimescale)"
"No Screen Blood in Power Armor" = "穿动力装甲时隐藏屏幕血迹"
"Hits put no blood on the screen while power armor is worn. (Stewie's Tweaks bPowerArmorPreventsScreenBlood)" = "穿戴动力装甲时受到攻击，屏幕上不会出现血迹。 (Stewie's Tweaks bPowerArmorPreventsScreenBlood)"
"Invisible Foes Stay Hidden" = "隐形敌人不改变准星颜色"
"An invisible foe does not turn the crosshair red. (Stewie's Tweaks bHideRedCrosshairOnDistantInvisibleTargets)" = "准星指向隐形敌人时不会变红。 (Stewie's Tweaks bHideRedCrosshairOnDistantInvisibleTargets)"
"Quiet Landings in God Mode" = "无敌模式下静默落地"
"In god mode the player's hard landings make no pain sound. (Stewie's Tweaks bGodmodePreventsLegCrippleSound)" = "无敌模式下，玩家从高处重重落地也不会发出吃痛声。 (Stewie's Tweaks bGodmodePreventsLegCrippleSound)"
"Count Repeated Console Lines" = "合并重复的控制台输出"
"A console line said again right after itself is counted on one line (line -#2). (Stewie's Tweaks bCompressDuplicateConsoleMessages)" = "控制台连续输出相同内容时合并为一行并累计次数，例如「消息 -#2」。 (Stewie's Tweaks bCompressDuplicateConsoleMessages)"
"Console Times" = "控制台显示时间"
"Console lines start with the time since the game started. (Stewie's Tweaks bConsolePrintsIncludeTimestamp)" = "控制台每行开头显示自游戏启动以来经过的时间。 (Stewie's Tweaks bConsolePrintsIncludeTimestamp)"
"Living Anatomy Shows DR" = "「活体解剖」显示伤害抗性"
"With Living Anatomy the target's line shows its Damage Resistance as well. (Stewie's Tweaks bLivingAnatomyShowDR)" = "拥有「活体解剖」专长时，目标信息栏还会显示其伤害抗性。 (Stewie's Tweaks bLivingAnatomyShowDR)"
"Matching Categories" = "同步两栏物品分类"
"In containers and barter both lists change category together. (Stewie's Tweaks bSynchronizeContainerCategories)" = "查看容器或交易时，两栏物品列表会同步切换分类。 (Stewie's Tweaks bSynchronizeContainerCategories)"
"Perks per Level" = "每次升级可选专长数"
"How many perks a level-up's perk page lets the player take; 1 changes nothing. (Stewie's Tweaks iPerksPerLevel)" = "每次升级时可在专长页选择的专长数量。设为 1 时保持默认。 (Stewie's Tweaks iPerksPerLevel)"
"S.P.E.C.I.A.L. Points" = "S.P.E.C.I.A.L. 总点数"
"The total the S.P.E.C.I.A.L. menu lets the player share out (when no script set one); 40 changes nothing. (Stewie's Tweaks bCustomSpecialPoints)" = "若脚本未设置点数，此值决定在 S.P.E.C.I.A.L. 菜单中可分配的总点数。设为 40 时保持默认。 (Stewie's Tweaks bCustomSpecialPoints)"
"Pick Any Lock" = "撬锁不受技能门槛限制"
"A lock above the player's Lockpick skill can still be picked. (Stewie's Tweaks bPickLocksWithoutSkill)" = "即使锁的难度超过玩家的开锁技能，仍可尝试撬锁。 (Stewie's Tweaks bPickLocksWithoutSkill)"
"Hack Any Terminal" = "破解不受技能门槛限制"
"A terminal above the player's Science skill can still be hacked. (Stewie's Tweaks bHackTerminalsWithoutSkill)" = "即使终端的难度超过玩家的科学技能，仍可尝试破解。 (Stewie's Tweaks bHackTerminalsWithoutSkill)"
"No Terminal Lockout" = "破解失败不锁定终端"
"A failed hack does not lock the terminal. (Stewie's Tweaks bNoLockFailedTerminals)" = "破解失败后，终端仍可继续使用。 (Stewie's Tweaks bNoLockFailedTerminals)"
"No Casino Bans" = "赌场不限制入场"
"Winning big never bans the player from a casino. (Stewie's Tweaks bNoCasinoBans)" = "即使赢了很多钱，赌场也不会禁止玩家入内。 (Stewie's Tweaks bNoCasinoBans)"
"Search the Unconscious" = "允许搜查昏迷角色"
"An unconscious actor can be searched like a dead one. (Stewie's Tweaks bLootUnconsciousVictims)" = "可以像搜查尸体一样搜查昏迷的角色。 (Stewie's Tweaks bLootUnconsciousVictims)"
"Revive Unconscious Companions" = "救醒昏迷的同伴"
"Activating a knocked-out companion uses a Stimpak and gets them up at once. (Stewie's Tweaks bReviveUnconsciousCompanions)" = "与昏迷的同伴互动会消耗一支治疗针，使其立即起身。 (Stewie's Tweaks bReviveUnconsciousCompanions)"
"Revive: Companions Stay Down" = "同伴倒地的最短时间"
"Least seconds a revivable companion stays down (and in a fight); 0 keeps 10. (Stewie's Tweaks bReviveUnconsciousCompanions, fUnconsciousTime)" = "可救醒的同伴至少倒地这么多秒，战斗中也适用。设为 0 时沿用 10 秒。 (Stewie's Tweaks bReviveUnconsciousCompanions, fUnconsciousTime)"
"Pickpocket Worn Items" = "允许扒窃已装备的物品"
"What an actor wears can be pickpocketed (never a child's). (Stewie's Tweaks bPickpocketWornItems)" = "可以扒窃角色身上穿戴的物品。儿童始终除外。 (Stewie's Tweaks bPickpocketWornItems)"
"No Sneak Criticals" = "禁用潜行暴击"
"The player's sneak attacks are not criticals. (Stewie's Tweaks bNoSneakAttacksCriticals)" = "玩家在潜行中发出的攻击不会造成暴击。 (Stewie's Tweaks bNoSneakAttacksCriticals)"
"Reload Only When Empty" = "弹匣打空后才能装填"
"The player cannot reload a magazine that still has rounds. (Stewie's Tweaks bDisableReloadingNonEmptyClip)" = "弹匣内还有弹药时，玩家无法重新装填。 (Stewie's Tweaks bDisableReloadingNonEmptyClip)"
"Fast Travel Takes No Time" = "快速旅行不消耗时间"
"Fast travel moves the clock (and hardcore needs) on by nothing. (Stewie's Tweaks bNoFastTravelTimeChange)" = "快速旅行期间，游戏时间与硬核模式需求均不推进。 (Stewie's Tweaks bNoFastTravelTimeChange)"
"Falls in Power Armor" = "动力装甲摔落伤害倍率"
"Fall damage to anyone in power armor is multiplied by this; x1.0 changes nothing. (Stewie's Tweaks bPowerArmorScalesFallDamage)" = "穿戴动力装甲的任何角色受到的摔落伤害均乘以此倍率。x1.0 保持原值。 (Stewie's Tweaks bPowerArmorScalesFallDamage)"
"Weightless Armor" = "护甲无重量"
"Armor weighs nothing. (Stewie's Tweaks bWeightlessItems, bArmor)" = "护甲不计重量。 (Stewie's Tweaks bWeightlessItems, bArmor)"
"Weightless Aid" = "补给品无重量"
"Aid items weigh nothing. (Stewie's Tweaks bWeightlessItems, bAid)" = "补给品不计重量。 (Stewie's Tweaks bWeightlessItems, bAid)"
"Weightless Ammo" = "弹药无重量"
"Ammo weighs nothing (it only weighs anything in Hardcore). (Stewie's Tweaks bWeightlessItems, bAmmo)" = "使弹药不计重量。按游戏原有规则，弹药只在硬核模式下有重量。 (Stewie's Tweaks bWeightlessItems, bAmmo)"
"Weightless Weapons" = "武器无重量"
"Weapons weigh nothing. (Stewie's Tweaks bWeightlessItems, bWeapons)" = "武器不计重量。 (Stewie's Tweaks bWeightlessItems, bWeapons)"
"Weightless Misc Items" = "杂项物品无重量"
"Misc items weigh nothing. (Stewie's Tweaks bWeightlessItems, bMisc)" = "杂项物品不计重量。 (Stewie's Tweaks bWeightlessItems, bMisc)"
"Worn Armor Weighs Nothing" = "穿戴中的护甲无重量"
"Armor weighs nothing while worn. (Stewie's Tweaks bWeightlessWornArmor)" = "护甲穿在身上时不计重量。 (Stewie's Tweaks bWeightlessWornArmor)"
"Show Weapon Poison Effects" = "显示武器的毒药效果"
"The Pip-Boy's weapon card names the poison on the weapon, its hits left and its effects. (Stewie's Tweaks bShowWeaponPoisonEffects)" = "Pip-Boy 的武器信息卡会显示所用毒药的名称、剩余生效次数和效果。 (Stewie's Tweaks bShowWeaponPoisonEffects)"
"No Poison Confirmation" = "涂毒无需确认"
"A poison goes on the weapon at the first use, without asking for a second. (Stewie's Tweaks bNoPoisonConfirm)" = "使用一次毒药便会涂到武器上，无需再次确认。 (Stewie's Tweaks bNoPoisonConfirm)"
"Summon Companions from the Map" = "从地图召回同伴"
"Clicking a companion's name on the World Map brings them to the player's side (every companion under the click). (Stewie's Tweaks bMapSelectableCompanions)" = "点击世界地图上的同伴名字可将其召到玩家身边。若一次点中多个同伴，则全部召回。 (Stewie's Tweaks bMapSelectableCompanions)"
"Summon Companions: Knocked-Out Too" = "允许召回昏迷的同伴"
"Knocked-out companions shown on the map can be summoned too. (Stewie's Tweaks bMapSelectableCompanions, bAllowSummonUnconsious)" = "也可召回地图上显示的昏迷同伴。 (Stewie's Tweaks bMapSelectableCompanions, bAllowSummonUnconsious)"
"Companions Near You on the Map" = "在地图上显示附近的同伴"
"The World Map names companions even when they are close to the player. (Stewie's Tweaks bNoMinCompanionMapDistance)" = "即使同伴就在玩家身边，世界地图也会显示其名字。 (Stewie's Tweaks bNoMinCompanionMapDistance)"
"Knocked-Out Companions on the Map" = "在地图上显示昏迷的同伴"
"The World Map names knocked-out companions too, in red. (Stewie's Tweaks bMapShowUnconsciousCompanions)" = "世界地图也会用红色显示昏迷同伴的名字。 (Stewie's Tweaks bMapShowUnconsciousCompanions)"
"Companions in the Locations' Font" = "同伴名字使用地点字体"
"The World Map writes companions' names in the font it names locations in. (Stewie's Tweaks bCompanionsUseLocationFontOnMap)" = "世界地图上，同伴名字和地点名称使用同一种字体。 (Stewie's Tweaks bCompanionsUseLocationFontOnMap)"
"Exterior and Interior Door Icons" = "区分出入口的门图标"
"Local map doors out look unlike doors in (Stewie's Tweaks' pictures if installed, else dimmer). (Stewie's Tweaks bInteriorExteriorMapDoorIcon)" = "区域地图上，外出的门与进入室内的门使用不同图标。若已安装 Stewie's Tweaks，会使用其中的图标，否则以较暗的图标区分。 (Stewie's Tweaks bInteriorExteriorMapDoorIcon)"
"Hostiles Prioritize Player" = "敌人优先攻击玩家"
"An enemy about to fight one of the player's companions may fight the player instead. (Stewie's Tweaks bHostilesPrioritizePlayer)" = "原本要和同伴交战的敌人可能转而攻击玩家。 (Stewie's Tweaks bHostilesPrioritizePlayer)"
"Hostiles Prioritize Player: At Start" = "敌人优先攻击玩家：开战概率"
