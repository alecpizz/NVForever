"More Precise RAD Meter: Decimal Places" = "辐射读数的小数位数"
"How many places after the point the meter shows (1 to 9). (Stewie's Tweaks bMorePreciseRadMeter, sFormat)" = "辐射表显示几位小数，范围为 1 至 9 位。 (Stewie's Tweaks bMorePreciseRadMeter, sFormat)"
"Doors on the Compass" = "在罗盘上显示门"
