"The number keys and the D-pad pick no weapon (the wheel still does). (Stewie's Tweaks bDisableWeaponHotkeys)" = "数字键和手柄方向键不再用于选择武器。武器选择轮仍然可用。 (Stewie's Tweaks bDisableWeaponHotkeys)"
"Pip-Boy Opens on Items" = "Pip-Boy 默认打开物品栏"
"The Pip-Boy always opens on the inventory. (Stewie's Tweaks bOpenPipboyToInventoryByDefault)" = "Pip-Boy 打开时始终进入物品栏。 (Stewie's Tweaks bOpenPipboyToInventoryByDefault)"
"No Crosshair While Reloading" = "装填时隐藏准星"
"The crosshair is hidden while reloading. (Stewie's Tweaks bHideCrosshairWhileReloading)" = "重新装填时不显示准星。 (Stewie's Tweaks bHideCrosshairWhileReloading)"
"Kill XP by Level" = "等级差影响击杀经验"
"Kill experience gains this per level the target is above you, loses it below; 0% is off. (Stewie's Tweaks bLevelDifferenceAffectsCombatXP)" = "目标每比玩家高一级，击杀经验增加此百分比。每低一级则减少此百分比。设为 0% 时关闭。 (Stewie's Tweaks bLevelDifferenceAffectsCombatXP)"
"Experience for Keys" = "钥匙开锁经验"
"Opening a lock with its key gives this share of picking it; 0% changes nothing. (Stewie's Tweaks bUsingKeysRewardsXP)" = "用钥匙开锁时，按撬锁经验的此百分比发放经验。设为 0% 时保持默认。 (Stewie's Tweaks bUsingKeysRewardsXP)"
"Experience for Passwords" = "密码解锁经验"
"Opening a terminal with its password gives this share of hacking it, once; 0% changes nothing. (Stewie's Tweaks bUsingNotesRewardsXP)" = "用密码打开终端时，按破解经验的此百分比发放一次经验。设为 0% 时保持默认。 (Stewie's Tweaks bUsingNotesRewardsXP)"
"Invert Look Left/Right" = "反转左右视角"
"The mouse and the stick turn the view the other way left and right. (Stewie's Tweaks bInvertCameraX)" = "鼠标和摇杆控制视角左右转动时，方向会反转。 (Stewie's Tweaks bInvertCameraX)"
"Nearest Unfound Place" = "显示最近的未发现地点"
"The nearest place not yet found shows on the compass at any distance. (Stewie's Tweaks bShowNearestUndiscoveredLocation)" = "无论相距多远，罗盘都会标出最近的未发现地点。 (Stewie's Tweaks bShowNearestUndiscoveredLocation)"
"Discoveries in the Corner" = "在屏幕角落提示发现地点"
"A place found is a corner line, not a banner. (Stewie's Tweaks bLocationDiscoveredCornerMessage)" = "发现地点时，在屏幕角落显示一条消息。 (Stewie's Tweaks bLocationDiscoveredCornerMessage)"
"Power Armor Blocks Radiation" = "动力装甲隔绝环境辐射"
"Power armor on the body keeps the world's radiation off; water and chems still count. (Stewie's Tweaks bNoEnvironmentRadiationInFullPowerArmor)" = "身穿动力装甲可隔绝环境辐射。水和药物造成的辐射仍然生效。 (Stewie's Tweaks bNoEnvironmentRadiationInFullPowerArmor)"
"Limb Damage in Power Armor" = "动力装甲肢体伤害倍率"
"Limb damage to anyone in power armor is multiplied by this; x1.0 changes nothing. (Stewie's Tweaks bPowerArmorScalesLimbDamage)" = "任何角色穿戴动力装甲时，肢体受到的伤害均乘以此倍率。x1.0 保持原值。 (Stewie's Tweaks bPowerArmorScalesLimbDamage)"
"Endurance Softens Falls" = "耐力提高安全落差"
"Safe fall height gains this per Endurance over 5, and loses it below; 0% changes nothing. (Stewie's Tweaks bEnduranceScalesMinFallHeight)" = "耐力每高于 5 一点，安全下落高度增加此比例，低于则减少；0% 时不变。 (Stewie's Tweaks bEnduranceScalesMinFallHeight)"
"Reverse Category Wheel" = "反转分类滚轮方向"
"The mouse wheel over a container's category title steps the other way. (Stewie's Tweaks bInvertContainerTitleScrollwheelDirection)" = "在容器的分类标题上滚动鼠标滚轮时，按相反的顺序切换分类。 (Stewie's Tweaks bInvertContainerTitleScrollwheelDirection)"
