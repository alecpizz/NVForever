"Frames a second, the mean frame time and the 1% low or the slowest frame (the row below chooses), from the time between frames." = "根据帧间隔显示每秒帧数、平均帧耗时，以及最慢 1% 帧的平均耗时或最慢一帧的耗时。末项可在下方切换。"
