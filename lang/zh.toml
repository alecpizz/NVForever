"The HUD shows the condition of the armour worn on the body, under the weapon's. (Stewie's Tweaks bArmorConditionLabel)" = "界面会在武器耐久度条下方显示身上护甲的耐久度。 (Stewie's Tweaks bArmorConditionLabel)"
"Armor Condition: Shown Below" = "护甲耐久度显示阈值"
"The armour's row shows only below this condition; 0% always. (Stewie's Tweaks bArmorConditionLabel)" = "护甲耐久度低于此百分比时才显示耐久度条。设为 0% 时始终显示。 (Stewie's Tweaks bArmorConditionLabel)"
"Armor Condition: Red Below" = "护甲耐久度变红阈值"
"The armour's bar turns red below this condition; 0% never. (Stewie's Tweaks bArmorConditionLabel)" = "护甲耐久度低于此百分比时，耐久度条变红。设为 0% 时永不变红。 (Stewie's Tweaks bArmorConditionLabel)"
"Armor Condition: Flashing Below" = "护甲耐久度闪红阈值"
"The armour's bar flashes red below this condition; 0% never. (Stewie's Tweaks bArmorConditionLabel)" = "护甲耐久度低于此百分比时，耐久度条闪红。设为 0% 时永不闪红。 (Stewie's Tweaks bArmorConditionLabel)"
"Armor Condition: In the Weapon's Place" = "护甲耐久度占用武器栏位置"
"With no weapon drawn the armour's row takes the weapon's place. (Stewie's Tweaks bArmorConditionLabel)" = "未举起武器时，护甲耐久度条会显示在武器耐久度条的位置。 (Stewie's Tweaks bArmorConditionLabel)"
"Scale Explosion Shake" = "调整爆炸晃动"
"The view shakes more or less when an explosion goes off near the player. (Stewie's Tweaks bScaleExplosionShake)" = "可增大或减小玩家附近发生爆炸时的镜头晃动。 (Stewie's Tweaks bScaleExplosionShake)"
"Scale Explosion Shake: Camera" = "爆炸镜头晃动幅度"
"How strongly the view shakes, 1 as it is, 0 not at all. (Stewie's Tweaks bScaleExplosionShake, fCameraMult)" = "调整镜头晃动的强度。设为 1 时保持原样，设为 0 时完全不晃动。 (Stewie's Tweaks bScaleExplosionShake, fCameraMult)"
"Switch Device by Pressing" = "按键切换输入设备"
"Pressing A on a controller switches the controls to it; a left click switches back to the keyboard and mouse. (Stewie's Tweaks bToggleControllerIfAttackPressed)" = "按手柄 A 键会切换到手柄。单击鼠标左键切回键盘和鼠标。 (Stewie's Tweaks bToggleControllerIfAttackPressed)"
"Fatigue Indicator" = "显示疲劳指示"
"An FTG word beside the HUD's H20 and FOD shows while Fatigue is below full: red below half, flashing below a quarter. (Stewie's Tweaks bHUDFatigueIndicator)" = "疲劳值未满时，HUD 会在 H20 和 FOD 旁显示 FTG。疲劳值低于一半时变红，低于四分之一时闪烁。 (Stewie's Tweaks bHUDFatigueIndicator)"
"Key Repeat Acceleration" = "加快长按键的重复速度"
"A key held down in a menu repeats faster the longer it is held. (Stewie's Tweaks bKeyRepeatAcceleration)" = "在菜单中按住一个键的时间越长，该按键重复触发得越快。 (Stewie's Tweaks bKeyRepeatAcceleration)"
"Key Repeat Acceleration: First Delay" = "首次加快按键重复的延迟"
"Seconds held before the repeats speed up the first time. (Stewie's Tweaks bKeyRepeatAcceleration, iDelay)" = "按住键多少秒后首次加快重复速度。 (Stewie's Tweaks bKeyRepeatAcceleration, iDelay)"
"Key Repeat Acceleration: First Speed" = "首次加快后的重复速度"
"How many times as fast the repeats come after the first delay. (Stewie's Tweaks bKeyRepeatAcceleration, fRateMult)" = "经过首次延迟后，按键重复速度变为原来的多少倍。 (Stewie's Tweaks bKeyRepeatAcceleration, fRateMult)"
"Key Repeat Acceleration: Second Delay" = "再次加快按键重复的延迟"
"Seconds held before the repeats speed up again. (Stewie's Tweaks bKeyRepeatAcceleration, iDelayAlt)" = "按住键多少秒后再次加快重复速度。 (Stewie's Tweaks bKeyRepeatAcceleration, iDelayAlt)"
"Key Repeat Acceleration: Second Speed" = "再次加快后的重复速度"
"How many times as fast the repeats come after the second delay. (Stewie's Tweaks bKeyRepeatAcceleration, fRateMultAlt)" = "经过第二次延迟后，按键重复速度变为原来的多少倍。 (Stewie's Tweaks bKeyRepeatAcceleration, fRateMultAlt)"
"More Precise RAD Meter" = "提高辐射读数精度"
