"The main menu continues the newest save at once, the first time it opens; hold Shift to stay on the menu. (Stewie's Tweaks bAutoContinueGame)" = "首次打开主菜单时立即继续最新存档。按住 Shift 键可停留在主菜单。 (Stewie's Tweaks bAutoContinueGame)"
