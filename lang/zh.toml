"Grass fires" = "草地起火"
"On: flamers, incendiary rounds and fire blasts set grass alight; the fire spreads and burns whoever stands in it. Off: fire stays where it hits." = "开启时，火焰喷射器、燃烧弹药和火焰爆炸会点燃草地。火势会蔓延，并烧伤处于火中的角色。关闭后火焰留在命中处。"
"Play Music" = "播放音乐"
