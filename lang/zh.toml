# NVForever's own words in Simplified Chinese.
# Written for NVForever, not copied from the game (LEGAL.md).
# How to add or fix a line: README.md beside this file.

name = "简体中文"

[words]
"Automatic Input Switching" = "自动切换输入设备"
"On: a controller button, stick or trigger selects Controller; a key or mouse click selects Keyboard and Mouse (mouse motion does not). Off: choose Input Device yourself." = "开启时，操作手柄按键、摇杆或扳机即可切换到手柄。按键盘或点击鼠标可切回键盘和鼠标，移动鼠标不会触发切换。关闭后请在「输入设备」中手动选择。"
"Dialogue voice" = "对话配音"
"On: lines are spoken. Off: they are silent from the next line on, and still last as long as their sound." = "开启时播放对话配音。关闭后从下一句开始静音，每句仍按原配音时长显示。"
"Gameplay" = "玩法"
"Turn to Each Other" = "交谈时互相转向"
"On: at the start of a conversation the actor turns to the player and the view turns to the actor." = "开启时，交谈开始后对方会转向你，镜头也会转向对方。"
"Bring the View Back on Choices" = "选择回答时转回对方"
"Close In on the Speaker" = "对话特写"
"On: in a conversation the view closes in on the speaker, the background out of focus; the mouse moves only the cursor. Off: you can look around." = "开启时，交谈中镜头拉近说话者并虚化背景，鼠标只控制指针。关闭后可以自由转动视角。"
"Goodbye hint" = "显示结束对话提示"
"On: \"[Tab] Goodbye\" stands at the left of the dialogue box while a Goodbye choice is offered. Off: hidden; Tab still says goodbye." = "开启时，若当前可以结束对话，对话框左侧会显示按 Tab 键结束对话的提示。关闭后隐藏提示，Tab 键仍然有效。"
"Aim assist" = "辅助瞄准"
"Controller only. On: the right stick turns slower over a nearby hostile, and aiming down the sights pulls the view onto one near the crosshair." = "仅适用于手柄。开启时，准星指向附近的敌人时右摇杆转向会减速。通过瞄具瞄准时，准星会被拉向附近的敌人。"
"Controller" = "手柄"
"Aim slowdown" = "瞄准减速"
"How much slower the right stick turns while the crosshair is on a nearby hostile (0: not at all)." = "准星指向附近敌人时，降低右摇杆转向速度的幅度。设为 0 时不减速。"
"Aim lock-on" = "瞄准吸附"
"How hard aiming down the sights turns the view onto a hostile near the crosshair (0: not at all). Push the right stick away to break it." = "使用瞄具时，准星被拉向附近敌人的力度。设为 0 时不吸附。向反方向拨动右摇杆即可解除吸附。"
"Use Pip-Boy" = "佩戴 Pip-Boy"
"On: the Pip-Boy is worn and the menus come up on the arm. Off: it is taken off and the menus show full screen, as always without a Pip-Boy." = "开启时佩戴 Pip-Boy，其菜单显示在手臂上。关闭时取下 Pip-Boy，其菜单改为全屏显示。"
"Kill camera" = "击杀镜头"
"When a VATS shot kills its last mark, a camera shows the kill. Last enemy: only when no other enemy still fights you. Every kill: always. Off: never." = "V.A.T.S. 射杀最后一个标记目标时可以播放击杀镜头。「最后一名敌人」仅在没有其他敌人继续与你交战时播放。「每次击杀」总会播放。「关闭」始终不播放。"
"V.A.T.S. style" = "V.A.T.S. 模式"
"What the V.A.T.S. key starts. Classic: the world stops and you pick body parts to hit. Mark and Fire: time runs very slowly while you mark targets." = "决定 V.A.T.S. 按键启动哪种模式。「经典」会暂停世界，让你选择要攻击的身体部位。「标记后开火」会大幅放慢时间，让你标记目标。"
"V.A.T.S. time slowdown" = "V.A.T.S. 时间减速"
"Slower while reloading" = "换弹时减速"
"On: you and the NPCs move at 75% of your speed while a reload runs. Off: reloading does not slow anyone, as in the original." = "开启时，换弹期间你和非玩家角色的移动速度降至各自原速度的 75%。关闭后换弹不影响移动速度。"
"Difficulty" = "难度"
"You deal / take / kill XP: Very Easy 200/50/100%, Easy 150/75/100%, Normal 100/100/100%, Hard 75/150/100%, Very Hard 50/200/100%." = "造成伤害 / 受到伤害 / 击杀经验：极易 200/50/100%，简单 150/75/100%，普通 100/100/100%，困难 75/150/100%，极难 50/200/100%。"
"You deal / take / kill XP: {levels}." = "造成伤害 / 受到伤害 / 击杀经验：{levels}。"
"Player damage" = "玩家伤害"
"Custom difficulty: how much damage your hits do, from 50% to 300%." = "自定义难度：调整你的攻击造成的伤害倍率，范围 50% 至 300%。"
"NPC damage" = "NPC 伤害"
"Custom difficulty: how much damage you take from NPCs and creatures (and falls and blasts), from 50% to 300%." = "自定义难度：调整你从 NPC、生物（以及坠落和爆炸）处受到的伤害倍率，范围 50% 至 300%。"
"Kill XP" = "击杀经验"
"Custom difficulty: how much XP a kill earns, from 50% to 300%." = "自定义难度：调整每次击杀获得的经验倍率，范围 50% 至 300%。"
"Dynamic crosshair" = "动态准星"
"On: with a gun or thrown weapon drawn the crosshair opens with how wide your shots spread now. Off: the arrows stay together." = "开启时，举起枪械或投掷武器后，准星会随当前散布范围张开。关闭后准星上的箭头保持固定。"
"Crosshair style" = "准星样式"
"With Dynamic crosshair on. Cross: four bars that part with the spread. Arrows: the plain crosshair's two arrows part instead." = "仅在启用「动态准星」时生效。「十字」的四条短线会随散布张开。「箭头」沿用普通准星的两支箭头，并随散布张开。"
"Detached third-person camera" = "第三人称自由镜头"
"On: in third person with your weapon away the mouse turns the camera around you and you run whichever way you push. Off: the camera stays behind you." = "开启时，在第三人称下收起武器后，可用鼠标绕角色转动镜头，角色朝移动输入的方向奔跑。关闭后镜头始终跟在角色身后。"
"Language" = "语言"
"The language of NVForever's own words (menus, messages). The game's own text is the install's." = "设置 NVForever 自身菜单和提示等界面文字的语言。游戏内容文字由已安装的游戏插件提供。"
"Interface" = "界面"
"Reverb" = "混响"
"World sounds echo as the place you are in does (a cave, a hall, a small room). Off: they do not." = "让环境音效随洞穴、大厅或小房间等场所产生混响。关闭后不添加混响。"
"Voice reverb" = "人声混响"
"What people say around you echoes in the place you are in, as Reverb does for world sounds. Conversations stay dry." = "周围人物的说话声与环境音效一样，会随场所产生混响。与人物交谈时的配音不受影响。"
"Sound" = "声音"
"Master" = "总音量"
"How loud all sound is: each volume below is a part of this one." = "控制整体音量。下方各项音量均以总音量为基准。"
"Music" = "音乐"
"The music of the place you are in and the main menu's theme." = "当前场景的背景音乐和主菜单音乐。"
"Footstep" = "脚步声"
"Footsteps, jumps and landings, yours and everyone's." = "你和其他角色的脚步、起跳及落地声。"
"Voice" = "人声"
"Spoken lines: conversations and what people say around you." = "与人物交谈时的配音和周围人物的说话声。"
"Effects" = "音效"
"Every other sound: weapons, impacts, menus, doors and the sounds of places." = "其他声音，包括武器、撞击、菜单、开关门和环境声。"
"Radio" = "电台"
"Radio stations, from the Pip-Boy and from radios in the world." = "Pip-Boy 和游戏世界中的收音机所播放的电台节目。"
"Freeze the picture in dialogue and menus" = "对话和菜单中冻结画面"
"On: animations, wind, water and sky stand still in conversations, the inventory and other menus, as in the original. Off: only game logic waits." = "开启时，对话、物品栏和其他菜单中会冻结动画、风、水面和天空，与原版一致。关闭后只暂停游戏逻辑。"
"Search" = "搜索"
"Changed" = "已更改"
"Audio" = "音频"
"Tweaks" = "微调"
"Game" = "游戏"
"Dialogue" = "对话"
"Camera" = "镜头"
"Screen" = "屏幕"
"Performance" = "性能"
"Picture" = "画面"
"Quality" = "画质"
"Keyboard search" = "使用键盘搜索"
"No settings here." = "此处没有设置项。"
"No results." = "没有搜索结果。"
"No changed settings." = "没有已更改的设置。"
"Stands for: {rows}." = "包含以下设置：{rows}。"
"Stands for: {rows} and {n} more." = "包含以下设置：{rows}，另有 {n} 项。"
"Button style" = "手柄按键样式"
"The names and pictures of the controller's buttons in prompts and hints. Auto: a PlayStation's when the controller says it is one, else an Xbox's." = "选择操作提示中手柄按键的名称和图标。「自动」会在设备识别为 PlayStation 手柄时采用对应样式，其余情况使用 Xbox 样式。"
"Light and noise gauges while sneaking" = "潜行时显示光照和噪声"
"On: two bars under the sneak word show how lit you are and how much noise you make, as detection counts them. Not in the original." = "开启时，潜行提示下方会显示两个进度条，分别表示影响被发现概率的光照和噪声。此功能为 NVForever 新增。"
"Saving" = "存档"
"Autosave after travel" = "场景切换后自动存档"
"On: the game saves to the autosave slot after each loading screen (doors, coc, a script moving you); fast travel has its own row." = "开启时，通过门、执行 coc 命令或被脚本传送等操作触发加载后，会写入自动存档槽。快速旅行另有设置。"
"Save on fast travel" = "快速旅行后存档"
"On: the game saves to the autosave slot when a fast travel arrives." = "开启时，快速旅行抵达目的地后会写入自动存档槽。"
"Save on wait" = "等待后存档"
"On: the game saves to the autosave slot when a wait ends with at least one hour passed." = "开启时，等待至少一小时后会写入自动存档槽。"
"Save on sleep" = "睡眠后存档"
"On: the game saves to the autosave slot when the player wakes from a sleep of at least one hour." = "开启时，玩家睡满一小时后醒来，会写入自动存档槽。"
"Save when a script asks" = "允许脚本触发存档"
"On: a script's Autosave saves to the autosave slot (quest milestones), SystemSave to the system slot, ForceSave as a new save." = "开启时，脚本中的 Autosave 写入自动存档槽（例如到达任务节点时），SystemSave 写入系统存档槽，ForceSave 创建新存档。"
"Hardcore mode" = "硬核模式"
"On: you need water, food and sleep, stimpaks heal over time, ammo has weight, crippled limbs need a doctor's bag or a doctor. Off: none of that." = "开启时，需要喝水、进食和睡眠，治疗针会逐步恢复生命值，弹药有重量，重伤肢体需要用医疗包或找医生治疗。关闭后取消这些规则。"
"HUD red" = "HUD 红色分量"
"HUD green" = "HUD 绿色分量"
"HUD blue" = "HUD 蓝色分量"
"Pip-Boy red" = "Pip-Boy 红色分量"
"Pip-Boy green" = "Pip-Boy 绿色分量"
"Pip-Boy blue" = "Pip-Boy 蓝色分量"
"One part of the colour above, 0 to 255; drag the meter or use Left and Right." = "调节上方颜色的这一分量，范围为 0 至 255。拖动滑块或使用左右方向键调整。"
"On: the music of the place you are in plays. Off: it is silent and goes on unheard." = "开启时播放当前场景的音乐。关闭后音乐仍继续播放，但听不到声音。"
"HUD scale" = "HUD 缩放"
"Size of the in-game HUD, independent of menu scale. Takes effect at the next start." = "调整游戏内 HUD 的大小，独立于菜单缩放。下次启动时生效。"
"Menu scale" = "菜单缩放"
"Size of the main, pause and other menus, independent of HUD scale. Takes effect at the next start." = "调整主菜单、暂停菜单等菜单的大小，独立于 HUD 缩放。下次启动时生效。"
"This terminal requires a password." = "此终端需要密码。"
"You need a Science skill of {needed} to hack this terminal." = "破解此终端需要科学技能达到 {needed}。"
"Lip sync" = "口型同步"
"On: a speaker's face moves with the line. Off: a face that is moving eases back to rest." = "开启时，角色的面部会随发音活动。关闭后，正在变化的表情会逐渐恢复自然。"
"Head tracking" = "头部追踪"
"On: actors turn their heads to the player and to others near them. Off: heads ease back to their animation." = "开启时，角色会转头看向玩家或附近的人。关闭后，头部会平滑恢复到动画原有的动作。"
"Feet follow the ground" = "双脚贴合地面"
"On: on slopes and steps actors bend their knees and set each foot on the ground under it. Off: the legs play the animation as it is." = "开启时，角色在斜坡和台阶上会屈膝，让双脚分别踏在各自下方的地面上。关闭后使用动画原有的腿部动作。"
"Sky follows the game clock" = "天空随游戏时间变化"
"On: the sky shows the game's time of day as it passes. Off: the sky keeps its hour while the game's clock runs on ([ and ] still set it)." = "开启时，天空随游戏中的时刻变化。关闭后天空停留在当前时刻，游戏时间仍然推进，也可用 [ 和 ] 调整天空时刻。"
"Resolution" = "分辨率"
"The window's size, or in full screen the monitor's (its own size: borderless). A new one goes back after 20 seconds unless you keep it." = "设置窗口或全屏时的分辨率。全屏使用显示器原生分辨率时为无边框模式。更改后若未确认保留，将在 20 秒后恢复。"
"Full screen" = "全屏"
"On: the game fills its monitor without a frame, at the full screen resolution above. Off: a window of the window resolution." = "开启时，按上方的全屏分辨率无边框铺满显示器。关闭后按窗口分辨率显示。"
"Monitor" = "显示器"
"The display the game opens on in full screen (the main display until you pick one)." = "选择全屏游戏使用的显示器。未选择时使用主显示器。"
"Body in first person" = "第一人称显示身体"
"On: in first person you see your own body and legs when you look down. Off: only the arms and the weapon are drawn, as in the original." = "开启时，第一人称视角下低头可见身体和双腿。关闭后沿用原版表现，只绘制手臂和武器。"
"NVF Features" = "NVF 功能"
"On: the switches below shape how your character, view and weapon move. Off: none of them acts, as in the original; each keeps its own choice." = "开启时，下方选项可以改变角色、镜头和武器的动作。关闭后恢复原版表现，并保留各项设置。"
"Global Toggle" = "总开关"
"Movement Weight" = "移动重量感"
"How heavy it all feels: 100% as made; lower makes speeding up, stopping and crouching quicker and cuts the extra time drawing and aiming take." = "控制动作的重量感。100% 为预设强度。降低数值可让起步、停步和下蹲更快，也会缩短额外的举枪和瞄准时间。"
"Movement Inertia" = "移动惯性"
"On: you speed up, glide to a stop and brake before turning; crouching eases and landings dip and slow you by the fall. Off: as in the original." = "开启时，起步逐渐加速，停下时会滑行一小段，转向前会减速。下蹲更平滑，落地时会根据下落幅度压低视角并减速。关闭后恢复原版表现。"
"Weapon Handling" = "武器操作"
"On: drawing, putting away and aiming a weapon take a moment longer, and longer still for heavier weapons. Off: the original's timing." = "开启时，取出、收起和瞄准武器所需时间略长，武器越重越明显。关闭后恢复原版时长。"
"Advanced Recoil" = "增强后坐力"
"On: a shot's kick eases the view up and part of it settles back down, and the view nudges back. Off: the whole kick stays, as in the original." = "开启时，开火后视角会平滑上抬，随后部分回落，同时略微向后震动。关闭后沿用原版表现，视角保持在上抬后的位置。"
"Sprint" = "冲刺"
"On: hold the Sprint key (set it in Controls) to run faster, spending AP every second; stopping low on AP leaves you out of breath. Off: as in the original." = "开启后，按住「控制」中设置的冲刺键即可加速奔跑，每秒消耗行动点数。行动点数较低时停下会喘气。关闭后恢复原版表现。"
"Turn on Sprint in NVF Features > Advanced Movement first." = "请先在「NVF 功能 > 进阶移动」中开启「冲刺」。"
"Turn on the Global Toggle in NVF Features > Advanced Movement first." = "请先在「NVF 功能 > 进阶移动」中启用「总开关」。"
"Weapon Inertia" = "武器惯性"
"On: in first person the arms and weapon lag behind turns and steps, bob, dip, breathe and recoil, heavier weapons more. Off: they stay still." = "开启时，第一人称的手臂和武器会随转向及步伐略微滞后，也会随呼吸、落地及后坐力产生晃动。武器越重，效果越明显。关闭后不应用这些动作。"
"Animation Smoothing" = "动画平滑过渡"
"On: in first person drawing, aiming, attacks, reloads and the Pip-Boy ease in and settle softly, taking no longer. Off: the original's clips." = "开启时，第一人称下取出武器、瞄准、攻击、换弹和使用 Pip-Boy 的动作衔接更平滑，耗时保持不变。关闭后沿用原版动画。"
"Camera Motion" = "镜头晃动"
"On: in first person the view bobs with each step, breathes, gets out of breath after running and jolts when you are hit. Off: it stays still." = "开启时，第一人称镜头会随脚步、呼吸和跑步后的喘息起伏，受击时还会震动。关闭后镜头保持稳定。"
"Lower weapon near walls" = "靠近墙壁时放低武器"
"On: in first person a drawn weapon lowers at a wall or a friend and comes back up when you aim or fire. Off: it stays up, as in the original." = "开启时，第一人称下靠近墙壁或友方角色会放低已举起的武器，瞄准或开火时重新抬起。关闭后武器保持原姿势。"
"True iron sights" = "对齐机械瞄具"
"On: aiming a gun lines its sights up with your eye and hides the crosshair. Off: the gun is held low with the crosshair, as in the original." = "开启时，瞄准会让视线对齐枪械瞄具并隐藏准星。关闭后沿用原版表现，枪械放低，准星仍然显示。"
"3D scopes (test)" = "3D 瞄准镜（测试中）"
"On: a scoped gun stays on screen and shows the zoomed view in its lens. Off: the full-screen scope picture, as in the original." = "开启时，使用带镜枪械瞄准时仍能看到枪身，放大的视野显示在镜片内。关闭后使用原版全屏瞄准镜画面。"
"Sun shadows" = "阳光阴影"
"The sun's shadows: Off, Performance (cheaper outdoors; moving shadows update at half the frame rate) or Quality. The original casts none from the world." = "设置阳光阴影。「性能」降低室外开销，移动阴影以帧率的一半更新。「画质」优先保证质量。「关闭」不绘制阳光阴影。原版场景物体不会投下此类阴影。"
"Grass" = "草地"
"On: grass grows on the landscape; the cells around you get theirs over the next frames. Off: it is hidden and none grows on new cells." = "开启时，地表会长出草，附近区块在随后几帧逐步生成草地。关闭后隐藏现有草地，新区块也不会生成草。"
"Distant terrain and objects" = "远处地形和物体"
"On: distant land, buildings and trees are drawn beyond the loaded cells (outdoors). Off: the world ends at the loaded cells." = "开启时，室外会绘制已加载区块以外的远处地形、建筑和树木。关闭后仅绘制已加载区块。"
"Colour grade" = "色彩分级"
"On: the picture is graded by the worldspace's, the weather's and the cell's image space. Off: the picture as lit, for comparisons." = "开启时，按世界空间、天气和区块的画面效果设置调整色调。关闭后保留光照结果，便于对比。"
"Text overlay" = "调试文字叠层"
"On: the position, loading counts and key help are written over the picture. Off by default in the game." = "开启时，在画面上显示位置、加载数量和按键提示。游戏默认关闭。"
"Shot markers" = "射击标记"
"On: a cross is drawn at each impact and a line from the muzzle along each hitscan shot." = "开启时，在每个着弹点绘制十字，并为每次即时命中射击绘制从枪口出发的射线。"
"God mode" = "无敌模式"
"On: the player takes no damage from hits and cannot be killed by them." = "开启时，玩家免受攻击伤害，攻击无法杀死玩家。"
"Draw the navmesh" = "显示导航网格"
"On: the navmesh near the camera and the walking NPCs' paths are drawn." = "开启时，绘制镜头附近的导航网格以及步行非玩家角色的路径。"
"Frame rate counter" = "帧率计数器"
"On: a panel of performance readings at the top right; the Counter rows below choose what it shows. Not in the original." = "开启时，右上角显示性能数据。用下方的计数器选项选择显示项目。此功能为 NVForever 新增。"
"Display sync" = "显示同步"
"Vertical sync: frames wait for the display (no tearing). Variable refresh: for a G-Sync or FreeSync screen. Off: frames show at once (may tear)." = "「垂直同步」将画面更新与显示器同步，以避免撕裂。「可变刷新率」适用于 G-Sync 或 FreeSync 屏幕。「关闭」会立即显示每一帧，可能出现撕裂。"
"Upscaler" = "超分辨率"
"Upscaling mode" = "超分辨率模式"
"FSR 3.1 or NVIDIA DLSS rebuilds the world at display resolution, at the mode below. DLSS needs an NVIDIA RTX card and its files in the dlss folder." = "FSR 3.1 或 NVIDIA DLSS 会按下方选定的模式，将游戏场景重建到显示分辨率。DLSS 需要 NVIDIA RTX 显卡，并须将所需文件放入 dlss 文件夹。"
"The share of the screen the world is drawn at; the upscaler rebuilds the rest. Native AA: full size. Quality to Ultra Performance: ever faster." = "设置场景内部渲染分辨率占屏幕分辨率的比例，再由超分辨率重建画面。「原生抗锯齿」使用全分辨率。「画质」到「极致性能」逐档提高速度。"
"DLSS model" = "DLSS 模型"
"Which DLSS model rebuilds the picture (NVIDIA calls them presets). Default, recommended: NVIDIA picks per mode. Only while DLSS draws." = "选择用于重建画面的 DLSS 模型，NVIDIA 称之为预设。建议保留「默认」，由 NVIDIA 按模式选择。仅在 DLSS 运行时生效。"
"Default" = "默认"
"DLSS only" = "仅适用于 DLSS"
"World" = "世界"
"Display" = "显示"
"Debug" = "调试"
"Graphics" = "图形"
"Field of view" = "视野角度"
"The game's field of view in degrees across a 4:3 picture (75 as the original's default); wider screens see more at the sides." = "按 4:3 画面测量的水平视野角度，原版默认 75°。屏幕越宽，两侧可见范围越大。"
"Viewmodel field of view" = "第一人称武器视野角度"
"The angle the first-person arms and weapon are drawn with, in degrees (55 as the original's default): lower draws them bigger and closer." = "绘制第一人称手臂和武器时的视野角度，原版默认 55°。角度越小，手臂和武器看起来越大、越近。"
"Frame rate limit" = "帧率上限"
"At most this many frames a second (Off: no limit of its own). A lower limit keeps the computer cooler and quieter." = "限制每秒最多绘制的帧数。「关闭」取消此项限制。降低上限有助于减少发热和噪声。"
"Physics rate" = "物理更新频率"
"How many times a second the physics moves the world on. Higher answers the keys sooner and collides more finely, but costs the processor more." = "每秒推进物理模拟的次数。频率越高，输入响应越快，碰撞计算越精细，但处理器开销也越高。"
"Match FPS" = "跟随帧率"
"Set by --physics-hz for this run" = "本次运行由 --physics-hz 指定"
"Object distance" = "物体绘制距离"
"How far from you objects of the loaded cells (buildings, rocks, furniture, clutter) are drawn. Lower draws fewer and runs faster." = "设置多远以内会绘制已加载区块中的物体，包括建筑、岩石、家具和杂物。降低数值会减少绘制量并提高性能。"
"Actor distance" = "角色绘制距离"
"How far from you people and creatures are drawn, as a part of the farthest the loaded cells reach." = "设置人物和生物的绘制距离，占已加载区块最远距离的比例。"
"Item distance" = "物品绘制距离"
"How far from you items lying in the world are drawn, as a part of the farthest the loaded cells reach." = "设置场景中地面物品的绘制距离，占已加载区块最远距离的比例。"
"Shadow distance" = "阴影距离"
"Grass distance" = "草地绘制距离"
"How far from you grass is drawn, as a part of the farthest grass distance and its fade range." = "设置草地绘制距离，占草地绘制及渐隐最远范围的比例。"
"Anti-aliasing" = "抗锯齿"
"Shadow filtering" = "阴影过滤"
"How the sun's shadow edges are softened: Fast (harder, cheapest), Smooth (as vanilla) or Temporal (grainy unless Anti-aliasing is TAA)." = "调整阳光阴影边缘的柔化方式。「快速」开销最低，边缘更硬。「平滑」接近原版表现。「时域」需搭配 TAA 抗锯齿，否则可能出现颗粒。"
"Shadow resolution" = "阴影分辨率"
"Size of the sun's and the flashlight's shadow maps: 4096 draws sharper shadows than 2048. It takes more video memory and a little frame rate." = "设置太阳和手电筒的阴影贴图尺寸。4096 比 2048 更清晰，会占用更多显存并略微降低帧率。"
"Ambient occlusion" = "环境光遮蔽"
"Creases, corners and the ground under things darken by how enclosed they are: Off, Performance (cheaper, a little grainier) or Quality. Not in the original." = "根据受遮挡程度加深缝隙、角落和物体下方的暗部：关闭、性能（开销更低，略带颗粒）或画质。此功能为 NVForever 新增。"
"Longer sun shadows" = "延长阳光阴影距离"
"On: the sun's shadows reach half as far again as the shadow distance. Costs a little frame rate." = "开启时，阳光阴影的覆盖距离增至「阴影距离」的 1.5 倍，会略微降低帧率。"
"Cloud shadows (experimental)" = "云影（实验性）"
"On: the weather's clouds cast soft shadows that drift over the land, only where the cover is heavier than around it. Still being tuned. Not in the original." = "开启时，比周围更厚的云层会投下随风移动的柔和阴影。此功能为 NVForever 新增，仍在调校。"
"Terrain shadows (experimental)" = "地形阴影（实验性）"
"On: at a low sun, hills and mountains shade the land beyond the reach of the sun's shadows. Still being tuned. Not in the original." = "开启时，太阳位置较低时，丘陵和高山会在阳光阴影覆盖范围之外投下阴影。此功能为 NVForever 新增，仍在调校。"
"ALCS (experimental)" = "ALCS（实验性）"
"ALCS (All Lights Cast Shadows): lamps, fires and spot lights cast shadows in the shadow distance; Performance casts fewer. Costs frame rate. Not in the original." = "ALCS（全光源投射阴影）：灯具、火焰和聚光灯会在阴影距离内投射阴影。「性能」模式下投射阴影的光源更少。会消耗帧率。此功能为 NVForever 新增。"
"Bloom" = "泛光"
"On: light brighter than a sunlit white wall (the sun, lamps, windows) glows into its surroundings, on top of the game's own image space." = "开启时，太阳、灯具和窗户等比阳光下的白墙更亮的光源会向周围泛光，叠加在场景自带的画面效果之上。"
"Light glow (HDR)" = "HDR 辉光"
"On: neon, lamps, beams and fire glow softly, as the original's HDR glow does, as much as the place's image space asks. Bloom adds to it." = "开启时，霓虹灯、灯具、光束和火焰会按场景画面效果设置呈现柔和辉光，接近原版 HDR 效果。泛光可叠加在辉光上。"
"Eye adaptation" = "明暗适应"
"On: dark views brighten after a moment, as the eye gets used to the dark, by the place's image space. Needs the light glow." = "开启时，进入暗处片刻后，画面会按所在场景的设置渐亮，模拟眼睛适应黑暗。需开启「HDR 辉光」。"
"Neon glow" = "霓虹辉光"
"On: where the image space asks for a strong glow (the Strip at night) neon burns with a wide halo, as in the original. Needs the light glow." = "开启时，在夜间赌城大道等设有强辉光的场景，霓虹灯会呈现宽阔的光晕，效果接近原版。需开启「HDR 辉光」。"
"Sharpening" = "锐化"
"On: the final picture is sharpened where it has little contrast (contrast-adaptive sharpening)." = "开启时，会对最终画面中对比度较低的部分进行自适应锐化。"
"Anisotropic filtering 16x" = "16 倍各向异性过滤"
"On: textures seen at a slant stay sharp further (16x instead of 8x). For textures loaded from now on (the cells loaded next)." = "开启时改用 16 倍过滤，替代 8 倍过滤，使倾斜角度下较远的纹理更清晰。此项适用于之后加载的纹理，例如新进入的区块。"
"Sun shafts" = "阳光光束"
"On: sunlight streams past what stands in front of the sun, stronger the hazier the weather's fog. Not in the original." = "开启时，阳光会从遮挡物边缘透出。天气越多雾，光束越明显。此功能为 NVForever 新增。"
"Screen-space reflections" = "屏幕空间反射"
"On: water the mirrored reflection does not reach (another height, interiors) reflects what is on the screen instead of only the sky." = "开启后，镜面反射覆盖不到的水面（例如不同高度处或室内）会反射屏幕中的景物。"
"Mirrored reflections" = "镜面反射"
"On: water mirrors the world above it, as in the original, drawing the scene a second time. Off: it reflects the sky." = "开启后会再次绘制水面上方的场景，让水面呈现与原版相同的镜像效果。关闭后水面反射天空。"
"Blend meshes into ground" = "模型与地面融合"
"On: softens where outdoor roads, rocks and cliffs meet the landscape, giving them the ground's colour and light there. Not in the original." = "开启时，软化室外道路、岩石和崖壁与地形的交界处，让接触区域呈现地面的颜色和光照。此功能为 NVForever 新增。"
"Quality preset" = "画质预设"
"Sets the rows the quality presets cover to the game folder's low.ini to VeryHigh.ini, and Smooth terrain (Off at Low and Medium). Custom: none match." = "加载游戏文件夹内 low.ini 至 VeryHigh.ini 的对应画质设置，并调整「平滑地形」（「低」和「中」预设下关闭）。都不符时为「自定义」。"
"Off (upscaling active)" = "关闭（超分辨率已启用）"
"DLSS (restart)" = "DLSS（需重启）"
"Needs an upscaler" = "需要启用超分辨率"
"Not with DLSS" = "启用 DLSS 时不可用"
"DLSS needs Windows" = "DLSS 需要 Windows"
"DLSS needs the Vulkan renderer" = "DLSS 需要使用 Vulkan 渲染器"
"DLSS files missing: choose Download DLSS… in this list, or put them in the dlss folder beside nvforever.exe, then restart" = "缺少 DLSS 文件。请在此列表中选择「下载 DLSS…」，或将文件放入 nvforever.exe 同级的 dlss 文件夹，然后重启。"
"The dlss folder holds NVIDIA's updater (nvngx_update.exe): remove it, then restart" = "dlss 文件夹中有 NVIDIA 更新程序（nvngx_update.exe）。请移除该文件，然后重启"
"A file in the dlss folder is not from the tested NVIDIA release (Streamline 2.14.16)" = "dlss 文件夹中有文件不属于已验证的 NVIDIA 版本（Streamline 2.14.16）"
"DLSS did not start (the log says why)" = "DLSS 启动失败，原因见日志"
"A graphics card the game may use cannot run DLSS" = "游戏可能使用的一块显卡不支持 DLSS"
"Not on this GPU or driver (DLSS needs an NVIDIA RTX card)" = "当前显卡或驱动不支持 DLSS（需要 NVIDIA RTX 显卡）"
"DLSS stopped working this session; it is tried again at the next start" = "DLSS 在本次运行中已停止工作，下次启动时会重试"
"FSR 3.1 cannot run on this GPU" = "当前显卡不支持 FSR 3.1"
"Frame generation" = "帧生成"
"Generated frames" = "生成帧倍率"
"Needs an NVIDIA RTX 40 series or newer" = "需要 NVIDIA RTX 40 系列或更新的显卡"
"Needs hardware-accelerated GPU scheduling" = "需要启用硬件加速 GPU 调度"
"Needs a newer NVIDIA driver" = "需要更新 NVIDIA 驱动程序"
"Files missing: Download DLSS… on the Upscaler row" = "缺少文件，请在「超分辨率」一栏选择「下载 DLSS…」"
"Restart to use DLSS Frame Generation" = "重启后可使用 DLSS 帧生成"
"The DLSS Frame Generation files are missing" = "缺少 DLSS 帧生成所需的文件"
"Needs vsync off" = "需要关闭垂直同步"
"Needs DLSS frame generation" = "需要启用 DLSS 帧生成"
"Frames made between the real ones: smoother motion, input a little later. FSR 3.1 needs FSR upscaling; DLSS an RTX 40 or newer. Not in the original." = "在实际渲染帧之间插入生成帧，使画面更流畅，但会略微增加输入延迟。FSR 3.1 帧生成需要启用 FSR 超分辨率。DLSS 帧生成需要 RTX 40 系列或更新的显卡。此功能为 NVForever 新增。"
"How many frames DLSS frame generation makes per real frame: 2x one, 3x two, 4x three (3x and 4x on RTX 50 series). Not in the original." = "设置 DLSS 在每个实际渲染帧之间插入多少帧。2x 插入一帧，3x 插入两帧，4x 插入三帧。3x 和 4x 适用于 RTX 50 系列。此功能为 NVForever 新增。"
"{choice} at a limit of {limit}: {real} real frames a second, which can feel choppy. Fewer generated frames, or a limit up to the display's refresh rate, give more." = "使用 {choice} 且帧率上限为 {limit} 时，每秒实际渲染 {real} 帧，操作可能感觉卡顿。减少生成帧，或将上限提高到显示器刷新率，可提高实际渲染帧率。"
"Controls" = "控制"
"HUD colour" = "HUD 颜色"
"The colour of the HUD and the menus: Amber (the default) or another; the sliders below set it to any colour." = "设置 HUD 和菜单颜色。默认使用「琥珀色」，也可选择其他预设或拖动下方滑块自定义。"
"Pip-Boy colour" = "Pip-Boy 颜色"
"The colour of the Pip-Boy's screens (items, stats, data): Amber (the default) or another; the sliders below set it to any colour." = "设置 Pip-Boy 的物品、状态和数据页面颜色。默认使用「琥珀色」，也可选择其他预设或拖动下方滑块自定义。"
