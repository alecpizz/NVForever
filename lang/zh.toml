"Barter by Kind: Selling Ammo" = "分类定价：出售弹药"
"The price multiplier of ammo items the player sells, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家出售弹药的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
"Barter by Kind: Selling Misc" = "分类定价：出售杂项"
"The price multiplier of misc items the player sells, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家出售杂项物品的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
"Barter by Kind: Selling Weapon Mod" = "分类定价：出售武器改装件"
"The price multiplier of weapon mod items the player sells, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家出售武器改装件的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
"Barter by Kind: Buying Armor" = "分类定价：购买护甲"
"The price multiplier of armor items the player buys, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家购买护甲的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
"Barter by Kind: Buying Weapon" = "分类定价：购买武器"
"The price multiplier of weapon items the player buys, before the Barter skill's. (Stewie's Tweaks bUseCustomBarterPriceMultipliers)" = "玩家购买武器的价格倍率，在交易技能倍率之前计算。 (Stewie's Tweaks bUseCustomBarterPriceMultipliers)"
