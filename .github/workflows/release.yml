name: release

# Builds every program NVForever has (fnvtool, nvforever, nvf-viewer) for Windows and
# Linux and publishes them as a GitHub release. Runs when a version tag (v*) is pushed,
# or by hand (Actions tab > release > Run workflow, naming the tag): a hand run builds
# the chosen branch's head and creates the tag there if it does not exist yet.
# No game data is packaged: the archives hold our programs, the schemas they read and
# the licence files only (CLAUDE.md charter), with THIRD-PARTY-LICENSES.txt listing the
# notices of every package the programs are built from (tools/release/third_party_licenses.py).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0); created at the branch head if new"
        required: true

# Read only for every job; the publish job alone may write (it creates the release and
# uploads its files). The build job runs every dependency's build script, so it holds no
# token that can push or change a release (#1999). Third-party actions are pinned to
# commit SHAs, their tag in a comment (Dependabot moves tag pins; rust-toolchain's follows
# its `stable` branch, which may need a hand update). tools/release/check_workflows.py
# checks both rules.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: .exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
            engine -> target
      - name: Linux system libraries for Bevy
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Build fnvtool and the launcher
        run: cargo build --release --locked -p fnvtool -p nvf-launcher
      - name: Build nvforever and nvf-viewer
        run: cargo build --release --locked -p nvforever -p nvf-viewer
        working-directory: engine
        # Only builds made here may send player reports to the project's server
        # (engine/nvforever/src/reports/mod.rs); local builds never do.
        env:
          NVF_OFFICIAL_BUILD: "1"

      - name: Package
        shell: bash
        env:
          DXC_TAG: v1.9.2609
          DXC_ZIP: dxc_2026_09_29.zip
          DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1
        run: |
          name="NVForever-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/release/fnvtool${{ matrix.exe }}" "dist/$name/"
          cp "target/release/nvforever-launcher${{ matrix.exe }}" "dist/$name/"
          cp "engine/target/release/nvforever${{ matrix.exe }}" "dist/$name/"
          cp "engine/target/release/nvf-viewer${{ matrix.exe }}" "dist/$name/"
          cp -r schemas "dist/$name/schemas"
          cp -r lang "dist/$name/lang"
          cp README.md LICENSE LEGAL.md tools/release/README-release.md "dist/$name/"
          # The notices of every third-party package the programs are built from.
          python tools/release/third_party_licenses.py --target "${{ matrix.target }}" --out "dist/$name/THIRD-PARTY-LICENSES.txt"
          if [ "${{ runner.os }}" = "Windows" ]; then
            # DXC for the DirectX 12 renderer (engine/nvforever/src/dx12_shader.rs): without it
            # wgpu compiles with FXC, too slowly to draw. Only dxcompiler.dll (built from the open
            # source, LLVM licence); dxil.dll is not needed (checked 2026-11-15) and not shipped.
            curl -fsSL -o dxc.zip "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_TAG}/${DXC_ZIP}"
            echo "${DXC_SHA256}  dxc.zip" | sha256sum -c -
            7z e dxc.zip -odxc 'bin\x64\dxcompiler.dll' LICENSE-LLVM.txt LICENSE-MS.txt > /dev/null
            cp dxc/dxcompiler.dll "dist/$name/"
            cp dxc/LICENSE-LLVM.txt "dist/$name/DXC-LICENSE-LLVM.txt"
            cp dxc/LICENSE-MS.txt "dist/$name/DXC-LICENSE-MS.txt"
            cp tools/release/nvforever.cmd tools/release/nvf-viewer.cmd "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp tools/release/nvforever.sh tools/release/nvf-viewer.sh "dist/$name/"
            chmod +x "dist/$name/"*.sh "dist/$name/nvforever" "dist/$name/nvf-viewer" "dist/$name/fnvtool" "dist/$name/nvforever-launcher"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: NVForever ${{ env.TAG }}
          body_path: tools/release/notes/${{ env.TAG }}.md
          prerelease: true
          files: dist/*
